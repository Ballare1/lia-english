<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘 영어 퀴즈</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
          --blue:#0071e3; --ok:#1a7f37; --okbg:#e8f5ec; --ng:#c62828; --ngbg:#fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --line:#38383a;
            --okbg:#12301c; --ngbg:#3a1414; --ok:#4cc96f; --ng:#ff6b6b; --blue:#2997ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { padding-right:90px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 0; }
  .tab { flex:1; font:inherit; font-size:15px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
         border-radius:12px; padding:9px 8px; cursor:pointer; }
  .tab.on { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .tab small { color:var(--sub); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:14px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
  .q { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .q .meta { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .q .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--line); margin-left:6px; }
  .q h2 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .q .ko { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .opt .oko { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .exp .en { display:block; margin-top:4px; color:var(--sub); }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none;
         border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin:8px 0; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.ng { border-color:var(--ng); background:var(--ngbg); }
  .exp { display:none; margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:14px; }
  .exp b { display:block; margin-bottom:2px; }
  .q.done .exp { display:block; }
  .q.wrong { outline:2px solid var(--ng); outline-offset:-2px; }
  .empty { background:var(--card); border-radius:16px; padding:24px; text-align:center; color:var(--sub); }
  .result { display:none; background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .result .score { font-size:40px; font-weight:700; margin:6px 0; }
  .result ul { text-align:left; padding-left:18px; color:var(--sub); font-size:14px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font:inherit; border:0; border-radius:22px; padding:10px 18px; cursor:pointer; background:var(--blue); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin-top:10px; }
  .close { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
           font:inherit; font-size:14px; border:0; border-radius:18px; padding:7px 14px; cursor:pointer;
           background:var(--card); color:var(--ink); box-shadow:0 1px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<button class="close" id="closeTop" aria-label="퀴즈 닫기">✕ 닫기</button>
<div class="wrap">
  <header><h1 id="title">🧩 오늘 영어 퀴즈</h1><p id="sub"></p></header>
  <div class="tabs">
    <button class="tab on" data-set="today">오늘 퀴즈 <small id="cntToday"></small></button>
    <button class="tab" data-set="review">지난 오답 풀기 <small id="cntReview"></small></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="list"></div>
  <div class="result" id="result">
    <div id="resTitle">오늘의 점수</div>
    <div class="score" id="score"></div>
    <div id="wrongTitle"></div>
    <ul id="wrongList"></ul>
    <div class="btns">
      <button class="btn" id="send">결과 보내기</button>
      <button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>
      <button class="btn ghost" id="reset">처음부터</button>
      <button class="btn ghost" id="closeEnd">닫고 돌아가기</button>
    </div>
    <div class="note" id="sendNote">결과를 보내면 리아가 틀린 표현을 기록해 다음 수업과 "지난 오답 풀기"에 다시 넣어요.</div>
  </div>
</div>
<script>
const DATA = {"id": "day032", "day": 32, "date": "2026-11-04", "theme": "이메일·프레젠테이션 + 📰 시사·경제", "questions": [{"expr": "The headline (here) is ~", "tag": "용법 Usage", "q": "You open the monthly review with your VP and want to give the single most important result first. What do you say?", "q_ko": "월간 리뷰를 시작하며 VP에게 가장 중요한 결과부터 먼저 말하고 싶어요. 뭐라고 할까요?", "opts": ["Headline is LG.com Saudi beat plan in October, mostly on fridges.", "The headline is that LG.com Saudi beat plan in October, mostly on fridges.", "Let me headline you that LG.com Saudi beat plan in October.", "The headline of it will come at the end, after all the details."], "a": 1, "why": "The headline is that ~가 맞아요. 관사 the가 필요하고, headline을 동사로 쓰면 어색해요. headline은 맨 앞에 먼저 던지는 말이라 끝에 둔다는 말과도 맞지 않아요.", "why_en": "\"The headline is that...\" leads with the key result.", "bank_key": "The headline (here) is ~"}, {"expr": "directionally right / directionally correct", "tag": "용법 Usage", "q": "Your October figures are preliminary, but you're confident about the trend. Which sentence fits?", "q_ko": "10월 숫자는 가집계지만 추세에는 확신이 있어요. 어떤 문장이 맞을까요?", "opts": ["These figures are directional correct, so the trend in Türkiye is above plan.", "These figures are directionally correct, and every decimal is final for audit.", "These figures are rightly directional, and Türkiye is growing above plan.", "These figures are still preliminary, but they're directionally correct: Türkiye is above plan."], "a": 3, "why": "가집계라도 방향은 맞다고 할 때 directionally correct를 써요. directional correct는 품사가 틀렸고, 소수점까지 확정이라는 말은 이 표현의 뜻과 반대예요.", "why_en": "\"Directionally correct\" means the trend is right, not the exact figure.", "bank_key": "directionally right / directionally correct"}, {"expr": "the so-what (for us)", "tag": "뉘앙스 Nuance", "q": "You show a chart of competitor discounts and your boss asks, \"What's the so-what?\" What is your boss really asking?", "q_ko": "경쟁사 할인 차트를 보여 줬더니 상사가 \"What's the so-what?\"이라고 물어요. 실제로 뭘 묻는 걸까요?", "opts": ["What does this mean for us, and what should we do about it?", "Can you send me the source data behind this chart?", "Which competitor offered the deepest discount this month?", "Why does this chart use a different format from last month?"], "a": 0, "why": "the so-what은 '그래서 우리에게 무슨 의미이고 뭘 해야 하나'를 묻는 말이에요. 데이터 출처나 세부 사실을 묻는 게 아니에요.", "why_en": "\"The so-what\" asks for the implication and the action.", "bank_key": "the so-what (for us)"}, {"expr": "net-net", "tag": "용법 Usage", "q": "On a call, you've listed the gains and losses from the Saudi campaign and now want to give the overall result. What do you say?", "q_ko": "통화에서 사우디 캠페인의 득실을 나열했고, 이제 전체 결과를 말하려고 해요. 뭐라고 할까요?", "opts": ["Net-net, our gross revenue before any deductions was SAR 40 million.", "Net-net, let me first list all the pluses and minuses for you.", "Net-net, the campaign paid for itself and we're slightly ahead.", "The net-net of the campaign launches next Monday in Riyadh."], "a": 2, "why": "net-net은 득실을 나열한 뒤 상계한 결론을 말할 때 써요. 상계 전 총액(gross)이나 나열을 시작할 때는 맞지 않아요.", "why_en": "\"Net-net\" gives the outcome after pluses and minuses.", "bank_key": "net-net"}, {"expr": "📰 (still) far apart (on ~)", "tag": "📰 시사 News", "q": "Noon wants a 12% co-op rate and you're offering 8%. Talks continue. How do you update your boss?", "q_ko": "Noon은 공동 마케팅 비율 12%를, 우리는 8%를 제시했고 협상이 이어지고 있어요. 상사에게 어떻게 보고할까요?", "opts": ["We're still far apart on the co-op rate, so I wouldn't count on it for Q1.", "We're still far away on the co-op rate, so I wouldn't count on it for Q1.", "We're still far apart to the co-op rate, so I wouldn't count on it for Q1.", "We're still apart far on the co-op rate, so I wouldn't count on it for Q1."], "a": 0, "why": "입장 차이는 far apart on ~로 말해요. far away는 물리적 거리이고, 전치사는 on, 어순은 far apart예요.", "why_en": "\"Far apart on X\" means the two sides disagree widely on X.", "bank_key": "(still) far apart (on ~)"}, {"expr": "📰 brace for ~ (be bracing for ~)", "tag": "📰 시사 News", "q": "Your forwarder warns of a big rate rise in January. You want your team to prepare for the hit. What do you say?", "q_ko": "포워더가 1월 운임이 크게 오른다고 경고했어요. 팀에게 그 충격에 대비하라고 말하고 싶어요. 뭐라고 할까요?", "opts": ["Let's brace the January rate rise and lock in shipments now.", "We're bracing to the January rate rise, so lock in shipments now.", "Let's embrace for the January rate rise and lock in shipments.", "We should brace for the January rate rise, so let's lock in shipments now."], "a": 3, "why": "부담스러운 일에 대비할 때 brace for ~를 써요. for가 꼭 필요하고, embrace는 '받아들이다'라는 다른 단어예요.", "why_en": "\"Brace for\" means prepare for something unwelcome.", "bank_key": "brace for ~ (be bracing for ~)"}], "review": [{"expr": "Where do you land on ~? / Where I've landed is ~", "tag": "지난 오답 Review", "q": "Your finance lead has heard all the arguments about opening a second Riyadh warehouse. You want their final position. What do you ask?", "q_ko": "재무 담당자가 리야드 2호 창고에 대한 찬반 논의를 모두 들었어요. 최종 입장을 묻고 싶어요. 뭐라고 할까요?", "opts": ["What's your landing on the second Riyadh warehouse?", "Where do you land at the second Riyadh warehouse?", "Where do you land on the second Riyadh warehouse?", "Where are you landing to the second Riyadh warehouse?"], "a": 2, "why": "최종 입장을 물을 땐 Where do you land on ~?이에요. 전치사는 on이고, 명사 landing이나 at·to는 어색해요.", "why_en": "\"Where do you land on X?\" asks for a final position.", "bank_key": "Where do you land on ~? / Where I've landed is ~", "from": "Day 4"}, {"expr": "bolster the case for ~", "tag": "지난 오답 Review", "q": "A click-and-collect pilot in Casablanca has lifted conversion, which supports extending it to Rabat. Which sentence is correct?", "q_ko": "카사블랑카의 매장 픽업 시범 운영으로 전환율이 올라, 라바트 확대에 힘이 실려요. 어떤 문장이 맞을까요?", "opts": ["The Casablanca results bolster the case for extending the pilot to Rabat.", "The Casablanca results bolster the case to extending the pilot to Rabat.", "We bolster the case of the Casablanca results extending to Rabat.", "The Casablanca results bolster for the case of extending to Rabat."], "a": 0, "why": "주어는 결과·데이터이고, the case for + 동명사로 써요. to나 of로 바꾸거나 for를 case 앞에 두면 틀려요.", "why_en": "Data \"bolsters the case for\" doing something.", "bank_key": "bolster the case for ~", "from": "Day 26"}, {"expr": "concerns linger / lingering concerns (over ~)", "tag": "지난 오답 Review", "q": "Power cuts have eased in South Africa, but shoppers are still worried they'll return. Which sentence is correct?", "q_ko": "남아공 정전은 줄었지만 소비자들은 다시 시작될까 여전히 걱정해요. 어떤 문장이 맞을까요?", "opts": ["Linger concerns over power cuts are holding back big-ticket purchases.", "Concerns are lingered over power cuts, holding back big-ticket purchases.", "Concerns linger power cuts and are holding back big-ticket purchases.", "Lingering concerns over power cuts are holding back big-ticket purchases."], "a": 3, "why": "linger는 자동사라 lingering concerns 또는 concerns linger로 써요. 수동태는 안 되고, 원인 앞에는 over나 about이 필요해요.", "why_en": "Use \"lingering concerns over X\" or \"concerns linger over X\".", "bank_key": "concerns linger / lingering concerns (over ~)", "from": "Day 26"}, {"expr": "(geopolitical) risk premium", "tag": "복습 Review", "q": "Your forwarder's new quote is 15% higher because of the Gulf conflict, not fuel or capacity. How do you explain the extra 15% to Finance?", "q_ko": "포워더의 새 견적이 연료나 선복이 아니라 걸프 분쟁 때문에 15% 올랐어요. 재무팀에 어떻게 설명할까요?", "opts": ["It's a premium tier that gets our containers to Jeddah faster.", "Most of that 15% is a risk premium, so it should come down if tensions ease.", "It's a risk premium, so it will stay in our contract permanently.", "It's a risky premium the forwarder has charged us by mistake."], "a": 1, "why": "risk premium은 위험 때문에 가격에 얹힌 추가분이라 위험이 줄면 빠질 수 있어요. premium을 '고급'으로 오해하지 마세요.", "why_en": "A risk premium is extra cost for risk, and it can unwind when risk falls.", "bank_key": "(geopolitical) risk premium", "from": "Day 3"}]};
const SETS = { today: DATA.questions, review: DATA.review || [] };
const KEY = "eng-quiz-" + DATA.id;
const saved = JSON.parse(localStorage.getItem(KEY) || '{"today":{},"review":{},"sent":{}}');
let cur = location.hash === "#review" ? "review" : "today", only = null;  // 메일의 "지난 오답 풀기" 링크는 #review

document.getElementById("sub").textContent = `Day ${DATA.day} · ${DATA.theme} · ${DATA.date}`;
document.getElementById("cntToday").textContent = `(${SETS.today.length})`;
document.getElementById("cntReview").textContent = `(${SETS.review.length})`;

function save() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function qs() { return SETS[cur]; }
function st() { return saved[cur]; }

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.set === cur));
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!qs().length) {
    list.innerHTML = '<div class="empty">지난 오답이 없어요 👏<br>틀린 문제가 생기면 여기에서 예문을 바꿔 다시 풀 수 있어요.</div>';
    document.getElementById("result").style.display = "none";
    document.getElementById("prog").style.width = "0";
    return;
  }
  qs().forEach((it, i) => {
    if (only && !only.includes(i)) return;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = `<div class="meta">${i + 1} / ${qs().length}<span class="tag"></span></div>
      <h2></h2><div class="ko"></div><div class="opts"></div><div class="exp"><b></b><span></span><span class="en"></span><div class="note"></div></div>`;
    card.querySelector(".tag").textContent = it.tag + (it.from ? ` · ${it.from}` : "");
    card.querySelector("h2").textContent = it.q;
    card.querySelector(".ko").textContent = it.q_ko || "";
    card.querySelector(".exp .en").textContent = it.why_en || "";
    card.querySelector(".exp span").textContent = it.why;
    card.querySelector(".exp .note").textContent = "표현: " + it.expr;
    it.opts.forEach((o, j) => {
      const b = document.createElement("button");
      // 보기는 영어만 보여준다 (한국어 번역은 정답을 흘리므로 표시하지 않음 — 2026-10-25 실장님 지시)
      const en = Array.isArray(o) ? o[0] : o;
      b.className = "opt"; b.textContent = `${"ABCD"[j]}. ${en}`;
      b.onclick = () => { st()[i] = j; save(); paint(card, it, i); update(); };
      card.querySelector(".opts").appendChild(b);
    });
    list.appendChild(card);
    if (st()[i] !== undefined) paint(card, it, i);
  });
  update();
}

function paint(card, it, i) {
  const pick = st()[i];
  card.classList.add("done");
  card.classList.toggle("wrong", pick !== it.a);
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === it.a) b.classList.add("ok");
    if (j === pick && pick !== it.a) b.classList.add("ng");
  });
  card.querySelector(".exp b").textContent = pick === it.a ? "✅ 정답" : `❌ 오답 — 정답은 ${"ABCD"[it.a]}`;
}

function wrongOf(set) { return SETS[set].map((_, i) => i).filter(i => saved[set][i] !== undefined && saved[set][i] !== SETS[set][i].a); }

function update() {
  const scope = only || qs().map((_, i) => i);
  document.getElementById("prog").style.width = (scope.filter(i => st()[i] !== undefined).length / scope.length * 100) + "%";
  const done = qs().every((_, i) => st()[i] !== undefined);
  document.getElementById("result").style.display = done ? "block" : "none";
  if (!done) return;
  const wrong = wrongOf(cur);
  document.getElementById("resTitle").textContent = cur === "today" ? "오늘의 점수" : "지난 오답 다시 풀기";
  document.getElementById("score").textContent = `${qs().length - wrong.length} / ${qs().length}`;
  document.getElementById("wrongTitle").textContent = wrong.length ? "복습할 표현" : "전부 맞혔어요 👏";
  document.getElementById("wrongList").innerHTML = "";
  wrong.forEach(i => { const li = document.createElement("li"); li.textContent = `${i + 1}번 — ${qs()[i].expr}`;
                       document.getElementById("wrongList").appendChild(li); });
  document.getElementById("retry").style.display = wrong.length ? "" : "none";
  document.getElementById("send").textContent = saved.sent[cur] ? "결과 다시 보내기" : "결과 보내기";
}

// 결과 보내기: 리아가 읽을 수 있는 정해진 형식으로 메일을 만든다 (회사 PC·휴대폰 어디서나 동작)
function resultText(set) {
  const w = wrongOf(set);
  return `[ENG-RESULT] ${DATA.id} ${set} ${SETS[set].length - w.length}/${SETS[set].length} wrong=${w.map(i => i + 1).join(",") || "none"}\n`
       + w.map(i => `- ${i + 1}. ${SETS[set][i].expr}`).join("\n");
}
document.getElementById("send").onclick = () => {
  const body = resultText(cur);
  saved.sent[cur] = new Date().toISOString(); save(); update();
  // 리아 웹(실장님 Mac) 안에서 열렸으면 바로 기록
  if (location.port === "8765") {
    // 리아 웹에서 열었으면 메일 없이 바로 기록하고 끝 (실패하면 메일로)
    fetch("/api/english/result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: DATA.id, set: cur, answers: saved[cur], text: body }) })
      .then(r => { if (!r.ok) throw 0; alert("리아에게 결과를 보냈어요 ✓"); })
      .catch(() => mailResult(body));
    return;
  }
  mailResult(body);
};
function mailResult(body) {
  location.href = "mailto:juslisten@gmail.com?subject=" + encodeURIComponent(`[퀴즈 결과] Day ${DATA.day} (${DATA.date})`)
                + "&body=" + encodeURIComponent(body + "\n\n(이대로 보내기만 하면 리아가 기록해요)");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { cur = t.dataset.set; only = null; render(); window.scrollTo(0, 0); });
document.getElementById("retry").onclick = () => {
  only = wrongOf(cur); only.forEach(i => delete st()[i]); save(); render(); window.scrollTo(0, 0);
};
document.getElementById("reset").onclick = () => { saved[cur] = {}; only = null; save(); render(); window.scrollTo(0, 0); };
function closeQuiz() {
  if (window.parent !== window) { window.parent.postMessage('lia-close-viewer', '*'); return; }
  window.close();
  setTimeout(() => {
    if (location.port === "8765") location.href = "/";
    else if (history.length > 1) history.back();
    else location.href = "about:blank";
  }, 300);
}
document.getElementById("closeTop").onclick = closeQuiz;
document.getElementById("closeEnd").onclick = closeQuiz;
render();
</script>
</body>
</html>
