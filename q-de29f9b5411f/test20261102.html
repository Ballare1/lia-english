<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘 영어 퀴즈</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
          --blue:#0071e3; --ok:#1a7f37; --okbg:#e8f5ec; --ng:#c62828; --ngbg:#fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --line:#38383a;
            --okbg:#12301c; --ngbg:#3a1414; --ok:#4cc96f; --ng:#ff6b6b; --blue:#2997ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { padding-right:90px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 0; }
  .tab { flex:1; font:inherit; font-size:15px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
         border-radius:12px; padding:9px 8px; cursor:pointer; }
  .tab.on { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .tab small { color:var(--sub); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:14px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
  .q { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .q .meta { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .q .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--line); margin-left:6px; }
  .q h2 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .q .ko { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .opt .oko { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .exp .en { display:block; margin-top:4px; color:var(--sub); }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none;
         border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin:8px 0; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.ng { border-color:var(--ng); background:var(--ngbg); }
  .exp { display:none; margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:14px; }
  .exp b { display:block; margin-bottom:2px; }
  .q.done .exp { display:block; }
  .q.wrong { outline:2px solid var(--ng); outline-offset:-2px; }
  .empty { background:var(--card); border-radius:16px; padding:24px; text-align:center; color:var(--sub); }
  .result { display:none; background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .result .score { font-size:40px; font-weight:700; margin:6px 0; }
  .result ul { text-align:left; padding-left:18px; color:var(--sub); font-size:14px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font:inherit; border:0; border-radius:22px; padding:10px 18px; cursor:pointer; background:var(--blue); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin-top:10px; }
  .close { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
           font:inherit; font-size:14px; border:0; border-radius:18px; padding:7px 14px; cursor:pointer;
           background:var(--card); color:var(--ink); box-shadow:0 1px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<button class="close" id="closeTop" aria-label="퀴즈 닫기">✕ 닫기</button>
<div class="wrap">
  <header><h1 id="title">🧩 오늘 영어 퀴즈</h1><p id="sub"></p></header>
  <div class="tabs">
    <button class="tab on" data-set="today">오늘 퀴즈 <small id="cntToday"></small></button>
    <button class="tab" data-set="review">지난 오답 풀기 <small id="cntReview"></small></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="list"></div>
  <div class="result" id="result">
    <div id="resTitle">오늘의 점수</div>
    <div class="score" id="score"></div>
    <div id="wrongTitle"></div>
    <ul id="wrongList"></ul>
    <div class="btns">
      <button class="btn" id="send">결과 보내기</button>
      <button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>
      <button class="btn ghost" id="reset">처음부터</button>
      <button class="btn ghost" id="closeEnd">닫고 돌아가기</button>
    </div>
    <div class="note" id="sendNote">결과를 보내면 리아가 틀린 표현을 기록해 다음 수업과 "지난 오답 풀기"에 다시 넣어요.</div>
  </div>
</div>
<script>
const DATA = {"id": "test20261102", "day": 0, "date": "2026-11-02", "theme": "주간 테스트", "questions": [{"expr": "Where do you land on ~? / Where I've landed is ~", "tag": "지난 오답 Review", "q": "Your Jeddah team has debated two fulfilment partners for a week. Before deciding, you want your logistics lead's considered view. What do you ask?", "q_ko": "제다 팀이 물류 파트너 두 곳을 두고 일주일째 논의했어요. 결정 전에 물류 리더의 숙고한 의견을 듣고 싶어요. 뭐라고 물을까요?", "opts": ["Where do you land at the two partners?", "Where are you landed on the two partners?", "Where do you land on the two partners?", "Where did you land to the two partners?"], "a": 2, "why": "상대의 최종 판단을 물을 땐 Where do you land on + 안건이에요. 전치사는 on이고, at·to를 쓰거나 수동형으로 바꾸면 어색해요.", "why_en": "\"Where do you land on X?\" asks for someone's considered position on X.", "bank_key": "Where do you land on ~? / Where I've landed is ~"}, {"expr": "I'll let you get back to it.", "tag": "뉘앙스 Nuance", "q": "You called Karim with a quick question about a Jumia listing. He's clearly in the middle of a report, and you want him to carry on working. How do you end the call?", "q_ko": "Jumia 리스팅 건으로 Karim에게 잠깐 전화했어요. 그는 보고서 작성 중인 게 분명해서, 하던 일을 계속하게 해 주고 싶어요. 어떻게 통화를 마칠까요?", "opts": ["Great, thanks Karim — I'll let you get back to it.", "Great, thanks Karim — I'll get back to you.", "Great, thanks Karim — you can get back on it.", "Great, thanks Karim — let me back to it."], "a": 0, "why": "I'll let you get back to it은 '하던 일 보세요'예요. I'll get back to you는 '나중에 답드릴게요'라 뜻이 달라요.", "why_en": "\"I'll let you get back to it\" ends a chat by returning them to their work.", "bank_key": "I'll let you get back to it."}, {"expr": "bolster the case for ~", "tag": "📰 시사 News", "q": "Saudi D2C margins have beaten 3P for three months, which supports your plan to shift volume to LG.com. Which sentence is correct?", "q_ko": "사우디 D2C 마진이 석 달째 3P를 앞서서, LG.com으로 물량을 옮기자는 계획에 힘이 실려요. 맞는 문장은?", "opts": ["Three months of higher margins bolster the case of shifting volume to LG.com.", "Three months of higher margins bolster on the case for shifting volume to LG.com.", "Three months of higher margins make the case bolstered to shift volume to LG.com.", "Three months of higher margins bolster the case for shifting volume to LG.com."], "a": 3, "why": "형태는 bolster the case for + 명사/동명사예요. 데이터·결과가 주어가 되어 주장에 근거를 더해 줘요.", "why_en": "The pattern is \"data bolsters the case for doing X\".", "bank_key": "bolster the case for ~"}, {"expr": "concerns linger / lingering concerns (over ~)", "tag": "📰 어색한 문장 찾기 Usage", "q": "Orders have picked up in Morocco, but retailers are still cautious about port delays. Which sentence is correct?", "q_ko": "모로코 주문은 살아났지만 유통사들은 항만 지연을 여전히 조심스러워해요. 맞는 문장은?", "opts": ["Orders are up, but port delays linger concerns among retailers.", "Orders are up, but lingering concerns over port delays are keeping retailers cautious.", "Orders are up, but concerns are lingered over port delays.", "Orders are up, but lingering concerns to port delays are keeping retailers cautious."], "a": 1, "why": "linger는 자동사라 목적어를 받거나 수동태로 쓰지 않아요. lingering concerns over(또는 about) ~가 맞아요.", "why_en": "\"Linger\" is intransitive; say \"lingering concerns over X\".", "bank_key": "concerns linger / lingering concerns (over ~)"}, {"expr": "(Big) shout-out to ~", "tag": "톤 Tone", "q": "You're writing a formal quarterly report for HQ and want to credit the Riyadh team. Which line suits this document?", "q_ko": "본사에 내는 공식 분기 보고서에서 리야드 팀의 공을 언급하고 싶어요. 이 문서에 어울리는 문장은?", "opts": ["Big shout-out to the Riyadh team for the White Friday numbers.", "Shout to the Riyadh team for the White Friday numbers.", "I'd like to recognize the Riyadh team for the White Friday results.", "Big shout-out at the Riyadh team for the White Friday results."], "a": 2, "why": "shout-out은 회의·슬랙에는 좋지만 공식 문서에는 가벼워요. 이때는 I'd like to recognize ~를 써요. shout to는 '~에게 소리치다', at은 틀린 전치사예요.", "why_en": "\"Shout-out\" is casual; formal documents call for \"I'd like to recognize\".", "bank_key": "(Big) shout-out to ~"}, {"expr": "temper (expectations / concerns)", "tag": "📰 시사 News", "q": "HQ expects a 40% uplift from Morocco's first campaign. You think that's too high and want to bring the number down to a realistic level. What do you say?", "q_ko": "본사가 모로코 첫 캠페인에서 40% 상승을 기대해요. 너무 높다고 보여서 현실적인 수준으로 낮추고 싶어요. 뭐라고 할까요?", "opts": ["I'd temper expectations on Morocco — 40% looks ambitious for a first campaign.", "I'd tamper with expectations on Morocco — 40% looks ambitious for a first campaign.", "I'd temper on expectations for Morocco — 40% looks ambitious for a first campaign.", "I'd lose temper on expectations for Morocco — 40% looks ambitious for a first campaign."], "a": 0, "why": "temper expectations가 '기대치를 현실적으로 낮추다'예요. tamper with는 '함부로 손대다·조작하다'라 위험하고, temper 뒤에 on을 붙이지 않아요.", "why_en": "\"Temper expectations\" means lowering them to a realistic level; \"tamper\" means to meddle.", "bank_key": "temper (expectations / concerns)"}, {"expr": "(Just) circling back on ~", "tag": "상황 Situation", "q": "You've already sent Nadia at the agency two \"just circling back\" notes with no reply, and the deadline is Thursday. What's the best next message?", "q_ko": "에이전시 Nadia에게 \"just circling back\" 메일을 이미 두 번 보냈는데 답이 없고, 마감은 목요일이에요. 다음 메시지로 가장 좋은 것은?", "opts": ["Just circling back on this one more time — any update at all?", "Just circling you back on this for the third time, as nothing has come through.", "As per my last two circle backs on this, please revert with an update soon.", "Hi Nadia, we need this confirmed by Thursday to hold the slot — I'll call you tomorrow."], "a": 3, "why": "같은 사람에게 연달아 쓰면 수동공격적으로 들려요. 그다음엔 마감일을 밝히거나 전화로 바꾸는 게 좋아요. circle you back은 틀린 형태예요.", "why_en": "After two nudges, switch to a clear deadline or a call instead of another circle-back.", "bank_key": "(Just) circling back on ~"}, {"expr": "Looping in ~ (loop someone in)", "tag": "뉘앙스 Nuance", "q": "You add Hana from Legal to an email thread because she needs to review a contract clause. Which line is right?", "q_ko": "계약 조항을 검토해야 해서 법무팀 Hana를 메일에 추가해요. 알맞은 문장은?", "opts": ["Copying Hana from Legal for visibility, as she needs to review the clause.", "Looping in Hana from Legal, who can review the clause.", "Looping Hana to Legal, who can review the clause.", "Looping at Hana from Legal, who can review the clause."], "a": 1, "why": "행동이 필요한 사람은 looping in이고, 뒤에 역할을 붙이면 자연스러워요. for visibility는 '조치 필요 없음'이라는 신호라 여기엔 맞지 않아요.", "why_en": "\"Loop in\" someone who must act; \"for visibility\" means no action needed.", "bank_key": "Looping in ~ (loop someone in)"}, {"expr": "(geopolitical) risk premium", "tag": "📰 시사 News", "q": "\"If tensions in the Red Sea ease, we'd expect the risk premium in freight rates to ___.\" Which verb fits?", "q_ko": "\"홍해 긴장이 완화되면, 운임에 붙은 리스크 프리미엄이 ___ 것으로 봅니다.\" 알맞은 동사는?", "opts": ["undertake", "upgrade", "unwind", "unfold"], "a": 2, "why": "리스크 프리미엄은 carry·build in으로 붙고 fade·unwind로 빠져요. unwind는 쌓였던 부분이 풀려 사라진다는 뜻이에요.", "why_en": "A risk premium builds in when fear rises and unwinds or fades when it eases.", "bank_key": "(geopolitical) risk premium"}, {"expr": "run rate (on a run rate of ~)", "tag": "상황 Situation", "q": "Saudi sales were unusually high during Ramadan, and finance wants to project the whole year from that month. How do you push back?", "q_ko": "라마단 기간 사우디 판매가 유난히 높았는데, 재무팀이 그 한 달로 연간 수치를 추정하려 해요. 어떻게 반박할까요?", "opts": ["That's our running rate for Ramadan, so it should hold for the year.", "Our burn rate jumped in Ramadan, so let's annualize that one month.", "We are in a run rate of Ramadan, so I'd annualize it carefully.", "That month is a Ramadan spike, so I wouldn't annualize that run rate."], "a": 3, "why": "시즌성이 큰 달을 기준으로 환산하면 부풀려지니 단서를 붙여요. running rate는 틀린 표현이고, burn rate는 현금 소진 속도예요.", "why_en": "A seasonal spike inflates a run rate, so don't annualize it.", "bank_key": "run rate (on a run rate of ~)"}, {"expr": "(be) skewed by ~ (skewed towards ~)", "tag": "용법 Usage", "q": "Large-screen TVs make up an unusually big share of this quarter's sales. \"Our sales mix is ___ large-screen TVs.\" Which phrase shows the direction of the lean?", "q_ko": "이번 분기 판매에서 대형 TV 비중이 유난히 커요. \"판매 구성이 대형 TV ___.\" 쏠림의 방향을 나타내는 말은?", "opts": ["skewed towards", "skewed at", "screwed towards", "skewing from"], "a": 0, "why": "쏠림 방향은 towards, 왜곡의 원인은 by예요. screwed는 비속어라 발음·철자 모두 조심하세요.", "why_en": "\"Skewed towards\" gives the direction; \"skewed by\" gives the cause.", "bank_key": "(be) skewed by ~ (skewed towards ~)"}, {"expr": "demand destruction", "tag": "📰 뉘앙스 Nuance", "q": "Fridge sales in Cairo dipped for one week after a public holiday, and a colleague calls it \"demand destruction\" in a report. What's the problem?", "q_ko": "공휴일 뒤 카이로 냉장고 판매가 한 주 줄었는데, 동료가 보고서에 \"demand destruction\"이라고 썼어요. 무엇이 문제일까요?", "opts": ["It's too informal for a written report.", "It's too strong, because one soft week doesn't mean shoppers have given up buying.", "It needs a plural form here, so it should read \"demand destructions\".", "It's only used for interest rates, so it can't describe fridges."], "a": 1, "why": "demand destruction은 가격 때문에 아예 안 사거나 대체하는 강한 말이에요. 한 주의 일시적 하락에 쓰면 과장으로 들리고, soft demand 정도가 맞아요.", "why_en": "Demand destruction means buyers leave or switch; a one-week dip is just soft demand.", "bank_key": "demand destruction"}, {"expr": "Our ask is ~ / What's the ask? (a big ask)", "tag": "용법 Usage", "q": "You're opening a negotiation with Noon and want to state in one line what you need from them. Which is correct?", "q_ko": "Noon과 협상을 시작하면서 원하는 바를 한 줄로 분명히 말하고 싶어요. 맞는 문장은?", "opts": ["Let me be clear on our asking: we need the OLED slot through Ramadan.", "Let me be clear on ask: we need the OLED slot through Ramadan.", "Let me be clear about asks of us: we need the OLED slot through Ramadan.", "Let me be clear on our ask: we need the OLED slot through Ramadan."], "a": 3, "why": "ask를 명사로 쓸 때는 관사나 소유격(our/the/a)이 필요해요. the asking은 틀린 표현이에요.", "why_en": "As a noun, \"ask\" needs a determiner: \"our ask\", \"the ask\", \"a big ask\".", "bank_key": "Our ask is ~ / What's the ask? (a big ask)"}, {"expr": "wiggle room (Is there any wiggle room on ~?)", "tag": "톤 Tone", "q": "You're writing a formal email to a senior executive at a new partner, asking whether payment terms can move. Which line suits the tone?", "q_ko": "새 파트너사 고위 임원에게 격식 있는 메일을 쓰며 결제 조건 조정이 가능한지 물어요. 어조에 맞는 문장은?", "opts": ["Is there a wiggle room on the payment terms?", "Got any wiggle room for the payment terms?", "Would there be any flexibility on the payment terms?", "Is there any wiggle in the room on the payment terms?"], "a": 2, "why": "wiggle room은 구어적이라 격식 있는 메일에는 flexibility가 안전해요. 셀 수 없는 명사라 a wiggle room도 틀려요.", "why_en": "\"Wiggle room\" is casual; \"flexibility\" is safer in a formal email.", "bank_key": "wiggle room (Is there any wiggle room on ~?)"}, {"expr": "hold off (on ~)", "tag": "📰 시사 News", "q": "You want to deliberately pause the January ad flight in Egypt until the pound settles — not cancel it. Which is correct?", "q_ko": "이집트 1월 광고 집행을 취소가 아니라, 파운드화가 안정될 때까지 의도적으로 멈추고 싶어요. 맞는 문장은?", "opts": ["Let's hold off on the January flight until the pound settles.", "Let's hold off to the January flight until the pound settles.", "Let's hold on the January flight until the pound settles.", "Let's hold out on the January flight until the pound settles."], "a": 0, "why": "hold off on + 명사/동명사가 '일단 보류하다'예요. hold on은 '잠깐 기다려', hold out은 '버티다' 쪽이에요.", "why_en": "\"Hold off on X\" means deliberately delaying X for now.", "bank_key": "hold off (on ~)"}], "review": []};
const SETS = { today: DATA.questions, review: DATA.review || [] };
const KEY = "eng-quiz-" + DATA.id;
const saved = JSON.parse(localStorage.getItem(KEY) || '{"today":{},"review":{},"sent":{}}');
let cur = location.hash === "#review" ? "review" : "today", only = null;  // 메일의 "지난 오답 풀기" 링크는 #review

document.getElementById("sub").textContent = `Day ${DATA.day} · ${DATA.theme} · ${DATA.date}`;
document.getElementById("cntToday").textContent = `(${SETS.today.length})`;
document.getElementById("cntReview").textContent = `(${SETS.review.length})`;

function save() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function qs() { return SETS[cur]; }
function st() { return saved[cur]; }

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.set === cur));
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!qs().length) {
    list.innerHTML = '<div class="empty">지난 오답이 없어요 👏<br>틀린 문제가 생기면 여기에서 예문을 바꿔 다시 풀 수 있어요.</div>';
    document.getElementById("result").style.display = "none";
    document.getElementById("prog").style.width = "0";
    return;
  }
  qs().forEach((it, i) => {
    if (only && !only.includes(i)) return;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = `<div class="meta">${i + 1} / ${qs().length}<span class="tag"></span></div>
      <h2></h2><div class="ko"></div><div class="opts"></div><div class="exp"><b></b><span></span><span class="en"></span><div class="note"></div></div>`;
    card.querySelector(".tag").textContent = it.tag + (it.from ? ` · ${it.from}` : "");
    card.querySelector("h2").textContent = it.q;
    card.querySelector(".ko").textContent = it.q_ko || "";
    card.querySelector(".exp .en").textContent = it.why_en || "";
    card.querySelector(".exp span").textContent = it.why;
    card.querySelector(".exp .note").textContent = "표현: " + it.expr;
    it.opts.forEach((o, j) => {
      const b = document.createElement("button");
      // 보기는 영어만 보여준다 (한국어 번역은 정답을 흘리므로 표시하지 않음 — 2026-10-25 실장님 지시)
      const en = Array.isArray(o) ? o[0] : o;
      b.className = "opt"; b.textContent = `${"ABCD"[j]}. ${en}`;
      b.onclick = () => { st()[i] = j; save(); paint(card, it, i); update(); };
      card.querySelector(".opts").appendChild(b);
    });
    list.appendChild(card);
    if (st()[i] !== undefined) paint(card, it, i);
  });
  update();
}

function paint(card, it, i) {
  const pick = st()[i];
  card.classList.add("done");
  card.classList.toggle("wrong", pick !== it.a);
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === it.a) b.classList.add("ok");
    if (j === pick && pick !== it.a) b.classList.add("ng");
  });
  card.querySelector(".exp b").textContent = pick === it.a ? "✅ 정답" : `❌ 오답 — 정답은 ${"ABCD"[it.a]}`;
}

function wrongOf(set) { return SETS[set].map((_, i) => i).filter(i => saved[set][i] !== undefined && saved[set][i] !== SETS[set][i].a); }

function update() {
  const scope = only || qs().map((_, i) => i);
  document.getElementById("prog").style.width = (scope.filter(i => st()[i] !== undefined).length / scope.length * 100) + "%";
  const done = qs().every((_, i) => st()[i] !== undefined);
  document.getElementById("result").style.display = done ? "block" : "none";
  if (!done) return;
  const wrong = wrongOf(cur);
  document.getElementById("resTitle").textContent = cur === "today" ? "오늘의 점수" : "지난 오답 다시 풀기";
  document.getElementById("score").textContent = `${qs().length - wrong.length} / ${qs().length}`;
  document.getElementById("wrongTitle").textContent = wrong.length ? "복습할 표현" : "전부 맞혔어요 👏";
  document.getElementById("wrongList").innerHTML = "";
  wrong.forEach(i => { const li = document.createElement("li"); li.textContent = `${i + 1}번 — ${qs()[i].expr}`;
                       document.getElementById("wrongList").appendChild(li); });
  document.getElementById("retry").style.display = wrong.length ? "" : "none";
  document.getElementById("send").textContent = saved.sent[cur] ? "결과 다시 보내기" : "결과 보내기";
}

// 결과 보내기: 리아가 읽을 수 있는 정해진 형식으로 메일을 만든다 (회사 PC·휴대폰 어디서나 동작)
function resultText(set) {
  const w = wrongOf(set);
  return `[ENG-RESULT] ${DATA.id} ${set} ${SETS[set].length - w.length}/${SETS[set].length} wrong=${w.map(i => i + 1).join(",") || "none"}\n`
       + w.map(i => `- ${i + 1}. ${SETS[set][i].expr}`).join("\n");
}
document.getElementById("send").onclick = () => {
  const body = resultText(cur);
  saved.sent[cur] = new Date().toISOString(); save(); update();
  // 리아 웹(실장님 Mac) 안에서 열렸으면 바로 기록
  if (location.port === "8765") {
    // 리아 웹에서 열었으면 메일 없이 바로 기록하고 끝 (실패하면 메일로)
    fetch("/api/english/result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: DATA.id, set: cur, answers: saved[cur], text: body }) })
      .then(r => { if (!r.ok) throw 0; alert("리아에게 결과를 보냈어요 ✓"); })
      .catch(() => mailResult(body));
    return;
  }
  mailResult(body);
};
function mailResult(body) {
  location.href = "mailto:juslisten@gmail.com?subject=" + encodeURIComponent(`[퀴즈 결과] Day ${DATA.day} (${DATA.date})`)
                + "&body=" + encodeURIComponent(body + "\n\n(이대로 보내기만 하면 리아가 기록해요)");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { cur = t.dataset.set; only = null; render(); window.scrollTo(0, 0); });
document.getElementById("retry").onclick = () => {
  only = wrongOf(cur); only.forEach(i => delete st()[i]); save(); render(); window.scrollTo(0, 0);
};
document.getElementById("reset").onclick = () => { saved[cur] = {}; only = null; save(); render(); window.scrollTo(0, 0); };
function closeQuiz() {
  if (window.parent !== window) { window.parent.postMessage('lia-close-viewer', '*'); return; }
  window.close();
  setTimeout(() => {
    if (location.port === "8765") location.href = "/";
    else if (history.length > 1) history.back();
    else location.href = "about:blank";
  }, 300);
}
document.getElementById("closeTop").onclick = closeQuiz;
document.getElementById("closeEnd").onclick = closeQuiz;
render();
</script>
</body>
</html>
