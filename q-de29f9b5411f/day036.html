<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘 영어 퀴즈</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
          --blue:#0071e3; --ok:#1a7f37; --okbg:#e8f5ec; --ng:#c62828; --ngbg:#fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --line:#38383a;
            --okbg:#12301c; --ngbg:#3a1414; --ok:#4cc96f; --ng:#ff6b6b; --blue:#2997ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { padding-right:90px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 0; }
  .tab { flex:1; font:inherit; font-size:15px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
         border-radius:12px; padding:9px 8px; cursor:pointer; }
  .tab.on { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .tab small { color:var(--sub); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:14px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
  .q { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .q .meta { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .q .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--line); margin-left:6px; }
  .q h2 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .q .ko { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .opt .oko { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .exp .en { display:block; margin-top:4px; color:var(--sub); }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none;
         border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin:8px 0; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.ng { border-color:var(--ng); background:var(--ngbg); }
  .exp { display:none; margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:14px; }
  .exp b { display:block; margin-bottom:2px; }
  .q.done .exp { display:block; }
  .q.wrong { outline:2px solid var(--ng); outline-offset:-2px; }
  .empty { background:var(--card); border-radius:16px; padding:24px; text-align:center; color:var(--sub); }
  .result { display:none; background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .result .score { font-size:40px; font-weight:700; margin:6px 0; }
  .result ul { text-align:left; padding-left:18px; color:var(--sub); font-size:14px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font:inherit; border:0; border-radius:22px; padding:10px 18px; cursor:pointer; background:var(--blue); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin-top:10px; }
  .close { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
           font:inherit; font-size:14px; border:0; border-radius:18px; padding:7px 14px; cursor:pointer;
           background:var(--card); color:var(--ink); box-shadow:0 1px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<button class="close" id="closeTop" aria-label="퀴즈 닫기">✕ 닫기</button>
<div class="wrap">
  <header><h1 id="title">🧩 오늘 영어 퀴즈</h1><p id="sub"></p></header>
  <div class="tabs">
    <button class="tab on" data-set="today">오늘 퀴즈 <small id="cntToday"></small></button>
    <button class="tab" data-set="review">지난 오답 풀기 <small id="cntReview"></small></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="list"></div>
  <div class="result" id="result">
    <div id="resTitle">오늘의 점수</div>
    <div class="score" id="score"></div>
    <div id="wrongTitle"></div>
    <ul id="wrongList"></ul>
    <div class="btns">
      <button class="btn" id="send">결과 보내기</button>
      <button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>
      <button class="btn ghost" id="reset">처음부터</button>
      <button class="btn ghost" id="closeEnd">닫고 돌아가기</button>
    </div>
    <div class="note" id="sendNote">결과를 보내면 리아가 틀린 표현을 기록해 다음 수업과 "지난 오답 풀기"에 다시 넣어요.</div>
  </div>
</div>
<script>
const DATA = {"id": "day036", "day": 36, "date": "2026-11-11", "theme": "이메일 + 📰 시사·경제", "questions": [{"expr": "Moving ~ to bcc (to spare your inbox)", "bank_key": "Moving ~ to bcc (to spare your inbox)", "tag": "상황 Situation", "q": "A colleague in Seoul introduced you to a Noon category head by email. You're now replying to both. What's the best first line?", "q_ko": "서울 동료가 이메일로 눈 카테고리 책임자를 소개해 줬어요. 두 사람 모두에게 답장할 때 가장 좋은 첫 줄은?", "opts": ["Thanks, Jin — I'll silently move you to bcc so you don't see our emails.", "Thanks, Jin — moving you to the bcc for your inbox.", "Thanks, Jin — you're now removed from this email.", "Thanks, Jin — moving you to bcc to spare your inbox."], "a": 3, "why": "공개적으로 밝히고 옮기는 게 매너이고, 고정형은 moving you to bcc(관사 없음) to spare your inbox예요. 'silently'는 몰래 한다는 뜻이라 역효과, 'removed'는 차갑게 들려요.", "why_en": "\"Moving you to bcc to spare your inbox\" — say it openly, no article."}, {"expr": "by EOD / by COB", "bank_key": "by EOD / by COB", "tag": "용법 Usage", "q": "You need the Turkey promo file today before people log off. Your team is in Istanbul and Dubai. Which request is clearest?", "q_ko": "오늘 퇴근 전까지 튀르키예 프로모션 파일이 필요해요. 팀은 이스탄불과 두바이에 있어요. 가장 명확한 요청은?", "opts": ["Please send the promo file until EOD.", "Please send the promo file by EOD today, Dubai time.", "Please send the promo file at the EOD.", "Please send the promo file in EOD."], "a": 1, "why": "마감은 by EOD이고, 시간대가 다른 팀이면 Dubai time처럼 기준을 붙이는 게 깔끔해요. until은 '그때까지 계속', at the EOD·in EOD는 어색해요.", "why_en": "Deadline = \"by EOD\"; add the time zone for multi-country teams."}, {"expr": "I'll defer to ~ (on ~)", "bank_key": "I'll defer to ~ (on ~)", "tag": "뉘앙스 Nuance", "q": "In an email thread, someone asks whether LG.com Egypt can accept a new payment method. Finance owns that decision. Which reply means \"I'll follow Finance's judgment\"?", "q_ko": "이메일 스레드에서 LG.com 이집트가 새 결제 수단을 받아도 되는지 묻는 질문이 나왔어요. 결정은 재무팀 소관이에요. '재무팀 판단에 따르겠다'는 뜻의 답은?", "opts": ["I'll defer this to Finance until next quarter.", "I'll differ to Finance on this one.", "I'll defer to Finance on this one.", "I'll defer Finance on this one."], "a": 2, "why": "defer to + 사람 = 그 사람 판단에 따르다. defer this until next quarter는 '미루다', differ는 '다르다', defer Finance는 '재무팀을 미루다'처럼 이상해져요.", "why_en": "\"Defer to someone\" = follow their judgment; \"defer something\" = postpone it."}, {"expr": "Closing the loop on ~ / To close the loop, ~", "bank_key": "Closing the loop on ~ / To close the loop, ~", "tag": "뉘앙스 Nuance", "q": "Two weeks ago, your boss asked why Amazon.sa showed the wrong OLED price. It's now fixed and confirmed. Which opener fits best?", "q_ko": "2주 전 상사가 Amazon.sa의 OLED 가격 오류를 물었어요. 이제 수정되고 확인까지 끝났어요. 가장 알맞은 첫마디는?", "opts": ["Closing the loop on the Amazon.sa OLED price — it's fixed and has been correct since Sunday.", "Circling back on the Amazon.sa OLED price — any update on your side?", "Closing a loop on the Amazon.sa OLED price — it's fixed since Sunday.", "Looping in on the Amazon.sa OLED price — it's fixed since Sunday."], "a": 0, "why": "결론을 들고 와서 건을 닫을 땐 Closing the loop on ~예요. circling back은 아직 답을 기다리며 다시 묻는 말이고, close a loop·looping in on은 어색해요.", "why_en": "\"Closing the loop on X\" = sharing the final outcome and ending the thread."}, {"expr": "📰 buck the trend", "bank_key": "buck the trend", "tag": "📰 상황 Situation", "q": "The South Africa TV market shrank this quarter, but your OLED sales grew. Which sentence fits your QBR slide?", "q_ko": "이번 분기 남아공 TV 시장은 줄었지만 우리 OLED 매출은 늘었어요. QBR 슬라이드에 맞는 문장은?", "opts": ["OLED followed the trend in South Africa, growing 9% while the market fell 4%.", "OLED bucked the trend in South Africa, growing 9% while the market fell 4%.", "OLED bucked a market in South Africa, growing 9% while the market fell 4%.", "OLED trended the buck in South Africa, growing 9% while the market fell 4%."], "a": 1, "why": "시장 흐름과 반대로 움직였으니 bucked the trend예요. followed the trend는 반대 뜻이고, bucked a market·trended the buck은 쓰지 않아요.", "why_en": "\"Buck the trend\" = move against the overall direction."}, {"expr": "📰 (put ~) on the table / (take ~) off the table", "bank_key": "(put ~) on the table / (take ~) off the table", "tag": "📰 뉘앙스 Nuance", "q": "Your distributor asks for an extra 5% margin. You won't do that at all, but you can offer marketing support. What do you say?", "q_ko": "유통사가 마진 5%를 더 달라고 해요. 그건 절대 안 되지만 마케팅 지원은 제안할 수 있어요. 뭐라고 할까요?", "opts": ["An extra 5% is on the table, but co-marketing is off the table.", "An extra 5% is on a table, but co-marketing support could be there too.", "Let's table the extra 5% and co-marketing support together.", "An extra 5% is off the table, but co-marketing support is definitely on the table."], "a": 3, "why": "배제한 선택지는 off the table, 살아 있는 선택지는 on the table이에요. 1번은 반대, on a table은 진짜 탁자, 동사 table은 미·영에서 뜻이 반대라 오해를 부를 수 있어요.", "why_en": "Off the table = ruled out; on the table = still an option."}], "review": [{"expr": "temper (expectations / concerns)", "bank_key": "temper (expectations / concerns)", "tag": "지난 오답 Review", "from": "Day 27", "q": "Oil prices fell sharply this week. In your monthly market note, which sentence uses \"temper\" correctly?", "q_ko": "이번 주 유가가 크게 떨어졌어요. 월간 시장 메모에서 temper를 바르게 쓴 문장은?", "opts": ["Lower oil prices have tempered concerns about shipping costs into the GCC.", "Lower oil prices have tampered concerns about shipping costs into the GCC.", "Lower oil prices have lost their temper about shipping costs into the GCC.", "Lower oil prices have tempered with concerns about shipping costs into the GCC."], "a": 0, "why": "데이터·사건도 temper의 주어가 될 수 있어요(우려를 누그러뜨리다). tamper는 '조작하다', lose one's temper는 '화내다', temper with는 쓰지 않아요.", "why_en": "Events can \"temper concerns\" — no preposition needed."}, {"expr": "directionally right / directionally correct", "bank_key": "directionally right / directionally correct", "tag": "지난 오답 Review", "from": "Day 32", "q": "Your Finance partner wants exact, audited numbers for the board pack today. Your figures are only rough estimates. Which is the most appropriate response?", "q_ko": "재무 담당자가 오늘 이사회 자료용으로 감사까지 끝난 정확한 숫자를 원해요. 내 숫자는 아직 대략적인 추정치예요. 가장 적절한 답은?", "opts": ["They're directionally right, so let's just use them in the board pack.", "They're directional correct, but good enough for the board.", "They're directionally right, but not board-ready — I'll have audited numbers by Thursday.", "They're direction right, so the board won't notice."], "a": 2, "why": "directionally right는 추세 판단용이지 정확한 숫자를 대신하지 못해요. 정확도가 필요한 자리에서는 한계를 밝히고 확정 시점을 주는 게 맞아요. directional correct·direction right는 문법 오류예요.", "why_en": "\"Directionally right\" signals the trend, not audit-level precision."}, {"expr": "bolster the case for ~", "bank_key": "bolster the case for ~", "tag": "지난 오답 Review", "from": "Day 26", "q": "Customer reviews on Noon keep praising your fast installation. You want to argue for adding installation booking at checkout. Which sentence is NOT natural?", "q_ko": "눈 고객 리뷰에서 빠른 설치 칭찬이 계속 나와요. 결제 단계에 설치 예약을 넣자고 주장하고 싶어요. 자연스럽지 않은 문장은?", "opts": ["These reviews bolster the case for adding installation booking at checkout.", "These reviews strengthen the case for adding installation booking at checkout.", "These reviews make a strong case for adding installation booking at checkout.", "These reviews bolster the case to adding installation booking at checkout."], "a": 3, "why": "the case 뒤에는 for + 명사/동명사가 와요. the case to adding은 틀린 형태예요. strengthen the case for, make a strong case for는 모두 자연스러워요.", "why_en": "It's \"the case for + -ing\", never \"the case to -ing\"."}, {"expr": "sticky inflation / inflation is (proving) sticky", "bank_key": "sticky inflation / inflation is (proving) sticky", "tag": "가끔 복습 Review", "from": "Day 28", "q": "US inflation came in above forecasts again for October. Which sentence best describes inflation that refuses to come down?", "q_ko": "10월 미국 물가가 또 예상보다 높게 나왔어요. 잘 내려오지 않는 인플레이션을 가장 잘 표현한 문장은?", "opts": ["Inflation is proving sticky, so the Fed may hike again in December.", "Inflation is in a sticky situation, so the Fed may hike again in December.", "Inflation is sticking, so the Fed may hike again in December.", "Inflation is stuck high-ly, so the Fed may hike again in December."], "a": 0, "why": "내려오지 않고 버티는 물가는 inflation is proving sticky예요. a sticky situation은 '곤란한 상황', is sticking·stuck high-ly는 어색해요.", "why_en": "\"Inflation is proving sticky\" = it's not coming down."}]};
const SETS = { today: DATA.questions, review: DATA.review || [] };
const KEY = "eng-quiz-" + DATA.id;
const saved = JSON.parse(localStorage.getItem(KEY) || '{"today":{},"review":{},"sent":{}}');
let cur = location.hash === "#review" ? "review" : "today", only = null;  // 메일의 "지난 오답 풀기" 링크는 #review

document.getElementById("sub").textContent = `Day ${DATA.day} · ${DATA.theme} · ${DATA.date}`;
document.getElementById("cntToday").textContent = `(${SETS.today.length})`;
document.getElementById("cntReview").textContent = `(${SETS.review.length})`;

function save() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function qs() { return SETS[cur]; }
function st() { return saved[cur]; }

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.set === cur));
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!qs().length) {
    list.innerHTML = '<div class="empty">지난 오답이 없어요 👏<br>틀린 문제가 생기면 여기에서 예문을 바꿔 다시 풀 수 있어요.</div>';
    document.getElementById("result").style.display = "none";
    document.getElementById("prog").style.width = "0";
    return;
  }
  qs().forEach((it, i) => {
    if (only && !only.includes(i)) return;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = `<div class="meta">${i + 1} / ${qs().length}<span class="tag"></span></div>
      <h2></h2><div class="ko"></div><div class="opts"></div><div class="exp"><b></b><span></span><span class="en"></span><div class="note"></div></div>`;
    card.querySelector(".tag").textContent = it.tag + (it.from ? ` · ${it.from}` : "");
    card.querySelector("h2").textContent = it.q;
    card.querySelector(".ko").textContent = it.q_ko || "";
    card.querySelector(".exp .en").textContent = it.why_en || "";
    card.querySelector(".exp span").textContent = it.why;
    card.querySelector(".exp .note").textContent = "표현: " + it.expr;
    it.opts.forEach((o, j) => {
      const b = document.createElement("button");
      // 보기는 영어만 보여준다 (한국어 번역은 정답을 흘리므로 표시하지 않음 — 2026-10-25 실장님 지시)
      const en = Array.isArray(o) ? o[0] : o;
      b.className = "opt"; b.textContent = `${"ABCD"[j]}. ${en}`;
      b.onclick = () => { st()[i] = j; save(); paint(card, it, i); update(); };
      card.querySelector(".opts").appendChild(b);
    });
    list.appendChild(card);
    if (st()[i] !== undefined) paint(card, it, i);
  });
  update();
}

function paint(card, it, i) {
  const pick = st()[i];
  card.classList.add("done");
  card.classList.toggle("wrong", pick !== it.a);
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === it.a) b.classList.add("ok");
    if (j === pick && pick !== it.a) b.classList.add("ng");
  });
  card.querySelector(".exp b").textContent = pick === it.a ? "✅ 정답" : `❌ 오답 — 정답은 ${"ABCD"[it.a]}`;
}

function wrongOf(set) { return SETS[set].map((_, i) => i).filter(i => saved[set][i] !== undefined && saved[set][i] !== SETS[set][i].a); }

function update() {
  const scope = only || qs().map((_, i) => i);
  document.getElementById("prog").style.width = (scope.filter(i => st()[i] !== undefined).length / scope.length * 100) + "%";
  const done = qs().every((_, i) => st()[i] !== undefined);
  document.getElementById("result").style.display = done ? "block" : "none";
  if (!done) return;
  const wrong = wrongOf(cur);
  document.getElementById("resTitle").textContent = cur === "today" ? "오늘의 점수" : "지난 오답 다시 풀기";
  document.getElementById("score").textContent = `${qs().length - wrong.length} / ${qs().length}`;
  document.getElementById("wrongTitle").textContent = wrong.length ? "복습할 표현" : "전부 맞혔어요 👏";
  document.getElementById("wrongList").innerHTML = "";
  wrong.forEach(i => { const li = document.createElement("li"); li.textContent = `${i + 1}번 — ${qs()[i].expr}`;
                       document.getElementById("wrongList").appendChild(li); });
  document.getElementById("retry").style.display = wrong.length ? "" : "none";
  document.getElementById("send").textContent = saved.sent[cur] ? "결과 다시 보내기" : "결과 보내기";
}

// 결과 보내기: 리아가 읽을 수 있는 정해진 형식으로 메일을 만든다 (회사 PC·휴대폰 어디서나 동작)
function resultText(set) {
  const w = wrongOf(set);
  return `[ENG-RESULT] ${DATA.id} ${set} ${SETS[set].length - w.length}/${SETS[set].length} wrong=${w.map(i => i + 1).join(",") || "none"}\n`
       + w.map(i => `- ${i + 1}. ${SETS[set][i].expr}`).join("\n");
}
document.getElementById("send").onclick = () => {
  const body = resultText(cur);
  saved.sent[cur] = new Date().toISOString(); save(); update();
  // 리아 웹(실장님 Mac) 안에서 열렸으면 바로 기록
  if (location.port === "8765") {
    // 리아 웹에서 열었으면 메일 없이 바로 기록하고 끝 (실패하면 메일로)
    fetch("/api/english/result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: DATA.id, set: cur, answers: saved[cur], text: body }) })
      .then(r => { if (!r.ok) throw 0; alert("리아에게 결과를 보냈어요 ✓"); })
      .catch(() => mailResult(body));
    return;
  }
  mailResult(body);
};
function mailResult(body) {
  location.href = "mailto:juslisten@gmail.com?subject=" + encodeURIComponent(`[퀴즈 결과] Day ${DATA.day} (${DATA.date})`)
                + "&body=" + encodeURIComponent(body + "\n\n(이대로 보내기만 하면 리아가 기록해요)");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { cur = t.dataset.set; only = null; render(); window.scrollTo(0, 0); });
document.getElementById("retry").onclick = () => {
