<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘 영어 퀴즈</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
          --blue:#0071e3; --ok:#1a7f37; --okbg:#e8f5ec; --ng:#c62828; --ngbg:#fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --line:#38383a;
            --okbg:#12301c; --ngbg:#3a1414; --ok:#4cc96f; --ng:#ff6b6b; --blue:#2997ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { padding-right:90px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 0; }
  .tab { flex:1; font:inherit; font-size:15px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
         border-radius:12px; padding:9px 8px; cursor:pointer; }
  .tab.on { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .tab small { color:var(--sub); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:14px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
  .q { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .q .meta { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .q .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--line); margin-left:6px; }
  .q h2 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .q .ko { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .opt .oko { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .exp .en { display:block; margin-top:4px; color:var(--sub); }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none;
         border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin:8px 0; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.ng { border-color:var(--ng); background:var(--ngbg); }
  .exp { display:none; margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:14px; }
  .exp b { display:block; margin-bottom:2px; }
  .q.done .exp { display:block; }
  .q.wrong { outline:2px solid var(--ng); outline-offset:-2px; }
  .empty { background:var(--card); border-radius:16px; padding:24px; text-align:center; color:var(--sub); }
  .result { display:none; background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .result .score { font-size:40px; font-weight:700; margin:6px 0; }
  .result ul { text-align:left; padding-left:18px; color:var(--sub); font-size:14px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font:inherit; border:0; border-radius:22px; padding:10px 18px; cursor:pointer; background:var(--blue); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin-top:10px; }
  .close { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
           font:inherit; font-size:14px; border:0; border-radius:18px; padding:7px 14px; cursor:pointer;
           background:var(--card); color:var(--ink); box-shadow:0 1px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<button class="close" id="closeTop" aria-label="퀴즈 닫기">✕ 닫기</button>
<div class="wrap">
  <header><h1 id="title">🧩 오늘 영어 퀴즈</h1><p id="sub"></p></header>
  <div class="tabs">
    <button class="tab on" data-set="today">오늘 퀴즈 <small id="cntToday"></small></button>
    <button class="tab" data-set="review">지난 오답 풀기 <small id="cntReview"></small></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="list"></div>
  <div class="result" id="result">
    <div id="resTitle">오늘의 점수</div>
    <div class="score" id="score"></div>
    <div id="wrongTitle"></div>
    <ul id="wrongList"></ul>
    <div class="btns">
      <button class="btn" id="send">결과 보내기</button>
      <button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>
      <button class="btn ghost" id="reset">처음부터</button>
      <button class="btn ghost" id="closeEnd">닫고 돌아가기</button>
    </div>
    <div class="note" id="sendNote">결과를 보내면 리아가 틀린 표현을 기록해 다음 수업과 "지난 오답 풀기"에 다시 넣어요.</div>
  </div>
</div>
<script>
const DATA = {"id": "day045", "day": 45, "date": "2026-11-24", "theme": "회의·협업 + 📰 시사·경제", "questions": [{"expr": "Just to play that back, ~ (Let me play that back)", "tag": "용법 Usage", "q": "At the end of a call, the Egypt distributor lists three things they'll do before Ramadan. You want to confirm you understood correctly without sounding suspicious. What do you say?", "q_ko": "통화 끝에 이집트 유통사가 라마단 전에 할 일 세 가지를 말해요. 의심하는 것처럼 들리지 않게, 제대로 이해했는지 확인하고 싶어요. 뭐라고 할까요?", "opts": ["So what you're really telling me is you'll do three things?", "Let me play back you the three things you said.", "Just to play that back — you'll restock the 75-inch, train the store staff, and share sell-out weekly. Have I got that right?", "To play it, you will do three things before Ramadan."], "a": 2, "why": "play that back + 요약 + Have I got that right?이 공손한 확인 틀이에요. play back you는 어순이 틀렸고, So what you're really telling me는 따지는 느낌이 나요.", "why_en": "\"Just to play that back\" + summary + \"Have I got that right?\" confirms politely.", "bank_key": "Just to play that back, ~ (Let me play that back)"}, {"expr": "What are we solving for (here)?", "tag": "상황 Situation", "q": "Your team is arguing about whether to add Tabby, Tamara, or both as payment options, but nobody has said what problem this fixes. How do you refocus the meeting?", "q_ko": "팀이 결제 수단으로 타비, 타마라, 아니면 둘 다 넣을지 논쟁 중인데, 이게 무슨 문제를 푸는 건지 아무도 말하지 않았어요. 회의를 어떻게 다시 잡을까요?", "opts": ["Before we pick a provider — what are we solving for here: cart abandonment or average order value?", "What are we solving here, the payments?", "What do we solve for it?", "What's the solution we are solving?"], "a": 0, "why": "What are we solving for (here)?는 수단 논쟁을 목표로 되돌리는 질문이에요. 끝의 for가 빠지거나 어순이 바뀌면 어색해요.", "why_en": "\"What are we solving for?\" pulls the discussion back to the goal; keep the final \"for\".", "bank_key": "What are we solving for (here)?"}, {"expr": "To build on what ~ said,", "tag": "뉘앙스 Nuance", "q": "Your colleague Huda suggests showing installation dates on product pages. You like it and want to take her idea one step further. What's the most natural opener?", "q_ko": "동료 후다가 상품 페이지에 설치 날짜를 보여 주자고 해요. 좋은 생각이라 한 단계 더 발전시키고 싶어요. 가장 자연스러운 첫마디는?", "opts": ["To build up what Huda said, ...", "To build on Huda, ...", "I disagree with Huda, so to build on that, ...", "To build on what Huda said, we could also let customers pick a time slot."], "a": 3, "why": "build on what ~ said가 '앞 의견 위에 쌓는다'는 정확한 형태예요. build up은 다른 뜻, 사람 이름만 쓰면 어색하고, 반대 의견 앞에는 맞지 않아요.", "why_en": "\"To build on what X said\" develops someone's idea — not for disagreeing.", "bank_key": "To build on what ~ said,"}, {"expr": "I'm on the fence (about ~).", "tag": "뉘앙스 Nuance", "q": "Your boss asks if you support moving part of the TV budget from Snapchat to YouTube in KSA. You honestly see pros and cons on both sides. Which answer fits best?", "q_ko": "상사가 사우디 TV 예산 일부를 스냅챗에서 유튜브로 옮기는 데 찬성하냐고 물어요. 솔직히 양쪽 다 장단점이 있어요. 가장 맞는 답은?", "opts": ["I'm not sold on it at all.", "I'm on the fence — YouTube gives us reach, but Snapchat still drives our under-25 traffic. I'd like one more week of data.", "I'm in the fence about it.", "I'm over the fence on YouTube."], "a": 1, "why": "on the fence는 정말 반반인 상태예요. not sold on은 반대 쪽으로 기운 회의감이라 다르고, in/over the fence는 쓰지 않아요. 이유와 다음 단계를 붙이면 우유부단해 보이지 않아요.", "why_en": "\"On the fence\" = genuinely undecided; \"not sold on\" leans negative.", "bank_key": "I'm on the fence (about ~)."}, {"expr": "📰 (make its / a) market debut (debut on ~)", "tag": "용법 Usage", "q": "You're writing to HQ that the new OLED will be sold on Noon UAE for the first time next Monday. Which sentence is correct and natural?", "q_ko": "본사에 신형 OLED가 다음 주 월요일 눈(Noon) UAE에서 처음 판매된다고 써요. 맞고 자연스러운 문장은?", "opts": ["The new OLED does its debut in Noon UAE next Monday.", "The new OLED will debut Noon UAE next Monday.", "The new OLED makes its debut on Noon UAE next Monday.", "The new OLED debuts itself at Noon UAE next Monday."], "a": 2, "why": "make its debut가 고정 짝이고(do ✗), 온라인 채널 앞은 on이에요. 동사 debut는 자동사라 목적어나 itself를 받지 않아요.", "why_en": "\"Make its debut on [channel]\" — not \"do a debut\"; the verb \"debut\" takes no object.", "bank_key": "📰 (make its / a) market debut (debut on ~)"}, {"expr": "📰 swing (sharply) / (wild) swings (swing between gains and losses)", "tag": "뉘앙스 Nuance", "q": "Cost-per-click on your Amazon.sa ads went from 2 riyals to 6 and back to 3 within one week. How do you describe this in your weekly report?", "q_ko": "Amazon.sa 광고 클릭당 단가가 일주일 사이에 2리얄 → 6리얄 → 3리얄로 움직였어요. 주간 보고에 어떻게 쓸까요?", "opts": ["CPCs swung sharply this week, so the weekly average hides a lot of day-to-day noise.", "CPCs swinged sharply this week.", "We swung the CPCs sharply this week.", "CPCs edged a little this week."], "a": 0, "why": "크게 오르내린 건 swing sharply예요. 과거형은 swung(swinged ✗), 자동사라 우리가 목적어로 '흔든' 게 아니에요. edge는 '조금씩' 움직일 때라 폭이 맞지 않아요.", "why_en": "\"Swing sharply\" = big moves up and down; past tense is \"swung\".", "bank_key": "📰 swing (sharply) / (wild) swings (swing between gains and losses)"}], "review": [{"expr": "temper (expectations / concerns)", "tag": "지난 오답 Review", "q": "The Morocco team is very excited about a new influencer, but she has never sold appliances before. In the kickoff, you want to gently lower their hopes. What do you say?", "q_ko": "모로코 팀이 새 인플루언서에 무척 들떠 있지만, 그는 가전을 팔아 본 적이 없어요. 킥오프에서 기대를 부드럽게 낮추고 싶어요. 뭐라고 할까요?", "opts": ["I'd tamper our hopes a little — she hasn't sold appliances before.", "I'd temper our hopes a little — she hasn't sold appliances before, so let's treat the first post as a test.", "I'd lose my temper a little about her.", "I'd temper with our hopes a little."], "a": 1, "why": "기대를 누그러뜨릴 땐 temper + 목적어(전치사 없음)예요. tamper는 '함부로 손대다', lose one's temper는 '화내다'예요. 지난 테스트에서 틀린 표현이에요.", "why_en": "\"Temper our hopes\" — direct object, no preposition; not \"tamper\".", "bank_key": "temper (expectations / concerns)", "from": "Day 27"}, {"expr": "directionally right / directionally correct", "tag": "지난 오답 Review", "q": "A quick survey of 40 store promoters in Jeddah says customers prefer the silver fridge over black. The sample is small. How do you present it to the product team?", "q_ko": "제다 매장 판촉사원 40명 간이 설문에서 고객이 검정보다 실버 냉장고를 선호한다고 나왔어요. 표본이 작아요. 제품팀에 어떻게 전달할까요?", "opts": ["The survey is directly correct, so silver wins.", "The survey is directional right on colors.", "The survey is directionally wrong but good enough.", "It's a small sample, but it's directionally right — silver is the safer bet for the first shipment."], "a": 3, "why": "숫자는 거칠어도 방향은 맞다는 뜻은 directionally right/correct예요(부사형 directionally). directly는 '직접'이라 다르고, directionally wrong은 반대 뜻이에요.", "why_en": "\"Directionally right\" = the trend is right even if the numbers are rough.", "bank_key": "directionally right / directionally correct", "from": "Day 6"}, {"expr": "bolster the case for ~", "tag": "지난 오답 Review", "q": "Customers who used the new 3D room planner on LG.com UAE bought 20% more often. You want to argue for rolling it out to Saudi. Which sentence works?", "q_ko": "LG.com UAE에서 새 3D 공간 배치 도구를 쓴 고객의 구매율이 20% 높았어요. 사우디로 확대하자고 주장하고 싶어요. 맞는 문장은?", "opts": ["The UAE results bolster the case for rolling the planner out in Saudi.", "The UAE results bolster on the case to roll it in Saudi.", "The case for Saudi bolsters the UAE results.", "The UAE results are bolstered for the Saudi case."], "a": 0, "why": "[근거] bolsters the case for [제안 -ing]가 기본 틀이에요. bolster 뒤에 전치사를 넣지 않고, 주어(근거)와 목적어(주장)를 뒤집으면 안 돼요.", "why_en": "[Evidence] bolsters the case for [doing something].", "bank_key": "bolster the case for ~", "from": "Day 26"}, {"expr": "(Just) to play devil's advocate", "tag": "가끔 복습 Review", "q": "Everyone agrees to give free delivery on every LG.com Egypt order in December. You actually support it, but want to check the risk. What do you say?", "q_ko": "모두가 12월 LG.com 이집트 전 주문 무료 배송에 동의해요. 나도 찬성하지만 리스크를 한번 짚고 싶어요. 뭐라고 할까요?", "opts": ["To be the devil, free delivery is wrong.", "Let me advocate the devil here.", "Just to play devil's advocate — what happens to our margin on small items like vacuum filters?", "Just to play a devil advocate, I disagree."], "a": 2, "why": "play devil's advocate는 진짜 반대가 아니라 일부러 반론을 내 본다는 신호예요. 관사 없이 devil's(소유격)로 써요.", "why_en": "\"Just to play devil's advocate\" signals a deliberate counterpoint, not real disagreement.", "bank_key": "(Just) to play devil's advocate", "from": "Day 4"}]};
const SETS = { today: DATA.questions, review: DATA.review || [] };
const KEY = "eng-quiz-" + DATA.id;
const saved = JSON.parse(localStorage.getItem(KEY) || '{"today":{},"review":{},"sent":{}}');
let cur = location.hash === "#review" ? "review" : "today", only = null;  // 메일의 "지난 오답 풀기" 링크는 #review

document.getElementById("sub").textContent = `Day ${DATA.day} · ${DATA.theme} · ${DATA.date}`;
document.getElementById("cntToday").textContent = `(${SETS.today.length})`;
document.getElementById("cntReview").textContent = `(${SETS.review.length})`;

function save() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function qs() { return SETS[cur]; }
function st() { return saved[cur]; }

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.set === cur));
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!qs().length) {
    list.innerHTML = '<div class="empty">지난 오답이 없어요 👏<br>틀린 문제가 생기면 여기에서 예문을 바꿔 다시 풀 수 있어요.</div>';
    document.getElementById("result").style.display = "none";
    document.getElementById("prog").style.width = "0";
    return;
  }
  qs().forEach((it, i) => {
    if (only && !only.includes(i)) return;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = `<div class="meta">${i + 1} / ${qs().length}<span class="tag"></span></div>
      <h2></h2><div class="ko"></div><div class="opts"></div><div class="exp"><b></b><span></span><span class="en"></span><div class="note"></div></div>`;
    card.querySelector(".tag").textContent = it.tag + (it.from ? ` · ${it.from}` : "");
    card.querySelector("h2").textContent = it.q;
    card.querySelector(".ko").textContent = it.q_ko || "";
    card.querySelector(".exp .en").textContent = it.why_en || "";
    card.querySelector(".exp span").textContent = it.why;
    card.querySelector(".exp .note").textContent = "표현: " + it.expr;
    it.opts.forEach((o, j) => {
      const b = document.createElement("button");
      // 보기는 영어만 보여준다 (한국어 번역은 정답을 흘리므로 표시하지 않음 — 2026-10-25 실장님 지시)
      const en = Array.isArray(o) ? o[0] : o;
      b.className = "opt"; b.textContent = `${"ABCD"[j]}. ${en}`;
      b.onclick = () => { st()[i] = j; save(); paint(card, it, i); update(); };
      card.querySelector(".opts").appendChild(b);
    });
    list.appendChild(card);
    if (st()[i] !== undefined) paint(card, it, i);
  });
  update();
}

function paint(card, it, i) {
  const pick = st()[i];
  card.classList.add("done");
  card.classList.toggle("wrong", pick !== it.a);
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === it.a) b.classList.add("ok");
    if (j === pick && pick !== it.a) b.classList.add("ng");
  });
  card.querySelector(".exp b").textContent = pick === it.a ? "✅ 정답" : `❌ 오답 — 정답은 ${"ABCD"[it.a]}`;
}

function wrongOf(set) { return SETS[set].map((_, i) => i).filter(i => saved[set][i] !== undefined && saved[set][i] !== SETS[set][i].a); }

function update() {
  const scope = only || qs().map((_, i) => i);
  document.getElementById("prog").style.width = (scope.filter(i => st()[i] !== undefined).length / scope.length * 100) + "%";
  const done = qs().every((_, i) => st()[i] !== undefined);
  document.getElementById("result").style.display = done ? "block" : "none";
  if (!done) return;
  const wrong = wrongOf(cur);
  document.getElementById("resTitle").textContent = cur === "today" ? "오늘의 점수" : "지난 오답 다시 풀기";
  document.getElementById("score").textContent = `${qs().length - wrong.length} / ${qs().length}`;
  document.getElementById("wrongTitle").textContent = wrong.length ? "복습할 표현" : "전부 맞혔어요 👏";
  document.getElementById("wrongList").innerHTML = "";
  wrong.forEach(i => { const li = document.createElement("li"); li.textContent = `${i + 1}번 — ${qs()[i].expr}`;
                       document.getElementById("wrongList").appendChild(li); });
  document.getElementById("retry").style.display = wrong.length ? "" : "none";
  document.getElementById("send").textContent = saved.sent[cur] ? "결과 다시 보내기" : "결과 보내기";
}

// 결과 보내기: 리아가 읽을 수 있는 정해진 형식으로 메일을 만든다 (회사 PC·휴대폰 어디서나 동작)
function resultText(set) {
  const w = wrongOf(set);
  return `[ENG-RESULT] ${DATA.id} ${set} ${SETS[set].length - w.length}/${SETS[set].length} wrong=${w.map(i => i + 1).join(",") || "none"}\n`
       + w.map(i => `- ${i + 1}. ${SETS[set][i].expr}`).join("\n");
}
document.getElementById("send").onclick = () => {
  const body = resultText(cur);
  saved.sent[cur] = new Date().toISOString(); save(); update();
  // 리아 웹(실장님 Mac) 안에서 열렸으면 바로 기록
  if (location.port === "8765") {
    // 리아 웹에서 열었으면 메일 없이 바로 기록하고 끝 (실패하면 메일로)
    fetch("/api/english/result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: DATA.id, set: cur, answers: saved[cur], text: body }) })
      .then(r => { if (!r.ok) throw 0; alert("리아에게 결과를 보냈어요 ✓"); })
      .catch(() => mailResult(body));
    return;
  }
  mailResult(body);
};
function mailResult(body) {
  location.href = "mailto:juslisten@gmail.com?subject=" + encodeURIComponent(`[퀴즈 결과] Day ${DATA.day} (${DATA.date})`)
                + "&body=" + encodeURIComponent(body + "\n\n(이대로 보내기만 하면 리아가 기록해요)");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { cur = t.dataset.set; only = null; render(); window.scrollTo(0, 0); });
document.getElementById("retry").onclick = () => {
  only = wrongOf(cur); only.forEach(i => delete st()[i]); save(); render(); window.scrollTo(0, 0);
};
document.getElementById("reset").onclick = () => { saved[cur] = {}; only = null; save(); render(); window.scrollTo(0, 0); };
function closeQuiz() {
  if (window.parent !== window) { window.parent.postMessage('lia-close-viewer', '*'); return; }
  window.close();
  setTimeout(() => {
    if (location.port === "8765") location.href = "/";
    else if (history.length > 1) history.back();
    else location.href = "about:blank";
  }, 300);
}
document.getElementById("closeTop").onclick = closeQuiz;
document.getElementById("closeEnd").onclick = closeQuiz;
render();
</script>
