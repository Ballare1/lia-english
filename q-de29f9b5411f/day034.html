<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘 영어 퀴즈</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
          --blue:#0071e3; --ok:#1a7f37; --okbg:#e8f5ec; --ng:#c62828; --ngbg:#fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --line:#38383a;
            --okbg:#12301c; --ngbg:#3a1414; --ok:#4cc96f; --ng:#ff6b6b; --blue:#2997ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { padding-right:90px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 0; }
  .tab { flex:1; font:inherit; font-size:15px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
         border-radius:12px; padding:9px 8px; cursor:pointer; }
  .tab.on { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .tab small { color:var(--sub); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:14px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
  .q { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .q .meta { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .q .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--line); margin-left:6px; }
  .q h2 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .q .ko { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .opt .oko { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .exp .en { display:block; margin-top:4px; color:var(--sub); }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none;
         border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin:8px 0; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.ng { border-color:var(--ng); background:var(--ngbg); }
  .exp { display:none; margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:14px; }
  .exp b { display:block; margin-bottom:2px; }
  .q.done .exp { display:block; }
  .q.wrong { outline:2px solid var(--ng); outline-offset:-2px; }
  .empty { background:var(--card); border-radius:16px; padding:24px; text-align:center; color:var(--sub); }
  .result { display:none; background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .result .score { font-size:40px; font-weight:700; margin:6px 0; }
  .result ul { text-align:left; padding-left:18px; color:var(--sub); font-size:14px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font:inherit; border:0; border-radius:22px; padding:10px 18px; cursor:pointer; background:var(--blue); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin-top:10px; }
  .close { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
           font:inherit; font-size:14px; border:0; border-radius:18px; padding:7px 14px; cursor:pointer;
           background:var(--card); color:var(--ink); box-shadow:0 1px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<button class="close" id="closeTop" aria-label="퀴즈 닫기">✕ 닫기</button>
<div class="wrap">
  <header><h1 id="title">🧩 오늘 영어 퀴즈</h1><p id="sub"></p></header>
  <div class="tabs">
    <button class="tab on" data-set="today">오늘 퀴즈 <small id="cntToday"></small></button>
    <button class="tab" data-set="review">지난 오답 풀기 <small id="cntReview"></small></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="list"></div>
  <div class="result" id="result">
    <div id="resTitle">오늘의 점수</div>
    <div class="score" id="score"></div>
    <div id="wrongTitle"></div>
    <ul id="wrongList"></ul>
    <div class="btns">
      <button class="btn" id="send">결과 보내기</button>
      <button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>
      <button class="btn ghost" id="reset">처음부터</button>
      <button class="btn ghost" id="closeEnd">닫고 돌아가기</button>
    </div>
    <div class="note" id="sendNote">결과를 보내면 리아가 틀린 표현을 기록해 다음 수업과 "지난 오답 풀기"에 다시 넣어요.</div>
  </div>
</div>
<script>
const DATA = {"id": "day034", "day": 34, "date": "2026-11-06", "theme": "설득·협상 + 스몰토크 + 📰 시사·경제", "questions": [{"expr": "What would it take to ~?", "tag": "상황 Situation", "q": "Amazon.sa says no to an extra Lightning Deal slot for your OLED TV. You want to keep the conversation open. What do you say?", "q_ko": "Amazon.sa가 OLED TV의 라이트닝 딜 추가 슬롯을 거절했어요. 대화를 닫지 않고 이어가고 싶어요. 뭐라고 할까요?", "opts": ["What would take to get one more slot this month?", "What would it take to get one more slot this month?", "What does it take to get slots in general?", "Why don't you just give us one more slot?"], "a": 1, "why": "이번 건의 조건을 묻는 건 What would it take to ~?예요. it이 빠지면 틀리고, What does it take는 일반론, Why don't you just ~는 따지는 말로 들려요.", "why_en": "\"What would it take to ~?\" asks for their conditions on this deal.", "bank_key": "What would it take to ~?"}, {"expr": "meet (someone) halfway / meet in the middle", "tag": "용법 Usage", "q": "A Noon partner wants a 14% margin; you offered 8%. You want to propose 11% politely. Which sentence is natural?", "q_ko": "Noon 파트너는 마진 14%를 원하고 당신은 8%를 제안했어요. 11%를 정중하게 제안하려면 어떤 문장이 자연스러울까요?", "opts": ["You need to meet halfway with us at 11%.", "Could we meet halfway with you at 11%?", "We must meet in the halfway at 11%.", "Could we meet you halfway at 11%?"], "a": 3, "why": "meet you halfway가 맞는 형태예요. meet halfway with you, in the halfway는 틀리고, You need to ~는 요구처럼 들려요.", "why_en": "The pattern is \"meet you halfway,\" softened with \"Could we.\"", "bank_key": "meet (someone) halfway / meet in the middle"}, {"expr": "a tough sell (↔ an easy sell)", "tag": "뉘앙스 Nuance", "q": "Your agency proposes a 30% budget increase for TikTok. You think HQ will resist but it's not impossible. What's the best reply?", "q_ko": "에이전시가 틱톡 예산 30% 증액을 제안했어요. 본사가 반대할 것 같지만 불가능하진 않아요. 가장 좋은 답은?", "opts": ["That'll be a tough sell with HQ unless we can show a clear sales link.", "That'll be tough sell to HQ unless we can show a clear sales link.", "That'll be a hard sell to HQ, so let's push them aggressively.", "That's impossible with HQ, full stop."], "a": 0, "why": "a tough sell with HQ가 '설득이 어렵지만 여지 있음'을 정확히 전해요. 관사 a가 빠지면 틀리고, hard sell은 '강압적 판매' 느낌, impossible은 여지를 닫아요.", "why_en": "\"A tough sell\" signals resistance but leaves room.", "bank_key": "a tough sell (↔ an easy sell)"}, {"expr": "I owe you one.", "tag": "톤 Tone", "q": "In which situation is \"I owe you one\" the most natural thing to say?", "q_ko": "\"I owe you one\"이 가장 자연스러운 상황은?", "opts": ["In a formal thank-you email to the regional President after a board review.", "When a supplier sends an invoice you haven't paid yet.", "When a colleague stayed late to fix your deck before a 9 a.m. HQ call.", "When opening a quarterly business review with Amazon."], "a": 2, "why": "동료가 범위 밖 도움을 줬을 때 쓰는 캐주얼한 감사예요. 고위 임원 공식 메일에는 가볍고, 실제 대금은 I owe you one의 뜻이 아니에요.", "why_en": "It's casual thanks for a personal favor from a peer.", "bank_key": "I owe you one."}, {"expr": "📰 a (supply) glut / tip into (a) surplus", "tag": "뉘앙스 Nuance", "q": "After White Friday, partners are sitting on far more washers than they can sell, and prices are under pressure. Which sentence fits best?", "q_ko": "화이트 프라이데이 이후 파트너들이 팔 수 있는 양보다 훨씬 많은 세탁기를 쌓아 두고 있고, 가격 압박이 커요. 가장 알맞은 문장은?", "opts": ["There's a small surplus of washers, so nothing to worry about.", "There's a glut with washers in the channel right now.", "There's a glut washers in the channel right now.", "There's a glut of washers in the channel, so let's hold sell-in."], "a": 3, "why": "넘쳐서 가격 압박까지 있는 상황엔 a glut of + 명사가 맞아요. glut with나 of 생략은 틀리고, small surplus는 상황을 축소해요.", "why_en": "\"A glut of\" signals a heavy, price-damaging oversupply.", "bank_key": "a (supply) glut / tip into (a) surplus"}, {"expr": "📰 (enter / fall into) correction territory (a correction)", "tag": "용법 Usage", "q": "Memory chip prices are down 3% this week after a strong run. How do you describe it accurately in a report?", "q_ko": "강세 뒤 메모리 칩 가격이 이번 주 3% 내렸어요. 보고서에 정확하게 쓰려면?", "opts": ["Memory prices have entered a correction territory this week.", "Memory prices saw a slight pullback this week, down 3%.", "Memory prices crashed into a bear market this week.", "Memory prices fell into correction territory, down 3%."], "a": 1, "why": "correction territory는 보통 고점 대비 10% 이상일 때 써요. 3%는 a pullback / a dip이 정확하고, a correction territory처럼 관사를 붙이지 않아요.", "why_en": "A correction means roughly 10%+; 3% is a pullback.", "bank_key": "(enter / fall into) correction territory (a correction)"}], "review": [{"expr": "temper (expectations / concerns)", "tag": "지난 오답 Review", "q": "Your Morocco team wants to announce a 40% growth target after one good week. You think that's too optimistic. What do you write?", "q_ko": "모로코 팀이 좋은 한 주를 보낸 뒤 40% 성장 목표를 발표하려고 해요. 너무 낙관적이라고 생각해요. 뭐라고 쓸까요?", "opts": ["Let's tamper the target before we share it with HQ.", "Let's lose our temper over the target before we share it with HQ.", "Let's temper expectations before we share a number with HQ.", "Let's temper down to expectations before we share it with HQ."], "a": 2, "why": "기대를 현실적인 수준으로 낮출 땐 temper expectations예요. tamper는 '함부로 손대다', lose one's temper는 '화내다'이고, temper down to는 쓰지 않아요.", "why_en": "\"Temper expectations\" means bring them to a realistic level.", "bank_key": "temper (expectations / concerns)", "from": "Day 27"}, {"expr": "directionally right / directionally correct", "tag": "지난 오답 Review", "q": "The new attribution model's ROAS numbers are rough, but they clearly show search ads beat display. How do you describe them to your boss?", "q_ko": "새 기여 모델의 ROAS 수치는 대략적이지만 검색 광고가 디스플레이보다 낫다는 건 분명히 보여요. 상사에게 어떻게 설명할까요?", "opts": ["The numbers are rough, but they're directionally correct.", "The numbers are rough, but they're directional correct.", "The numbers are rough, but they're correct in direction exactly.", "The numbers are rough, but they're 100% accurate."], "a": 0, "why": "세부는 확정 아니지만 방향은 맞다는 뜻은 directionally correct(부사+형용사)예요. directional correct는 문법이 틀리고, 100% accurate는 사실과 달라요.", "why_en": "\"Directionally correct\" = right trend, not final numbers.", "bank_key": "directionally right / directionally correct", "from": "Day 6"}, {"expr": "bolster the case for ~", "tag": "지난 오답 Review", "q": "Strong repeat-purchase data from LG.com UAE supports launching a membership program. Which sentence works best in your proposal?", "q_ko": "LG.com UAE의 높은 재구매 데이터가 멤버십 프로그램 도입을 뒷받침해요. 제안서에 가장 알맞은 문장은?", "opts": ["I bolster the case of a membership program with this data.", "This data bolsters the case to a membership program.", "This data bolsters the case on launching a membership program.", "The repeat-purchase data bolsters the case for launching a membership program."], "a": 3, "why": "주어는 데이터, 뒤에는 the case for + 동명사/명사예요. of, to, on은 틀린 전치사고, 사람이 주어면 어색해요.", "why_en": "Data \"bolsters the case for\" an idea.", "bank_key": "bolster the case for ~", "from": "Day 26"}, {"expr": "Appreciate you making the time.", "tag": "가끔 복습 Mix", "q": "A busy Amazon category leader joins your call at short notice. What's a natural way to open?", "q_ko": "바쁜 Amazon 카테고리 리더가 급하게 콜에 들어왔어요. 자연스러운 첫마디는?", "opts": ["Appreciate for your time, I know it's short notice.", "Appreciate you making the time — I know it was short notice.", "Thank you for your precious time.", "You made the time, appreciating."], "a": 1, "why": "appreciate는 타동사라 Appreciate you making the time이 자연스러워요. appreciate for는 틀리고, precious time은 한국식 직역이라 과해요.", "why_en": "\"Appreciate you making the time\" is natural and warm.", "bank_key": "Appreciate you making the time.", "from": "Day 3"}]};
const SETS = { today: DATA.questions, review: DATA.review || [] };
const KEY = "eng-quiz-" + DATA.id;
const saved = JSON.parse(localStorage.getItem(KEY) || '{"today":{},"review":{},"sent":{}}');
let cur = location.hash === "#review" ? "review" : "today", only = null;  // 메일의 "지난 오답 풀기" 링크는 #review

document.getElementById("sub").textContent = `Day ${DATA.day} · ${DATA.theme} · ${DATA.date}`;
document.getElementById("cntToday").textContent = `(${SETS.today.length})`;
document.getElementById("cntReview").textContent = `(${SETS.review.length})`;

function save() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function qs() { return SETS[cur]; }
function st() { return saved[cur]; }

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.set === cur));
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!qs().length) {
    list.innerHTML = '<div class="empty">지난 오답이 없어요 👏<br>틀린 문제가 생기면 여기에서 예문을 바꿔 다시 풀 수 있어요.</div>';
    document.getElementById("result").style.display = "none";
    document.getElementById("prog").style.width = "0";
    return;
  }
  qs().forEach((it, i) => {
    if (only && !only.includes(i)) return;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = `<div class="meta">${i + 1} / ${qs().length}<span class="tag"></span></div>
      <h2></h2><div class="ko"></div><div class="opts"></div><div class="exp"><b></b><span></span><span class="en"></span><div class="note"></div></div>`;
    card.querySelector(".tag").textContent = it.tag + (it.from ? ` · ${it.from}` : "");
    card.querySelector("h2").textContent = it.q;
    card.querySelector(".ko").textContent = it.q_ko || "";
    card.querySelector(".exp .en").textContent = it.why_en || "";
    card.querySelector(".exp span").textContent = it.why;
    card.querySelector(".exp .note").textContent = "표현: " + it.expr;
    it.opts.forEach((o, j) => {
      const b = document.createElement("button");
      // 보기는 영어만 보여준다 (한국어 번역은 정답을 흘리므로 표시하지 않음 — 2026-10-25 실장님 지시)
      const en = Array.isArray(o) ? o[0] : o;
      b.className = "opt"; b.textContent = `${"ABCD"[j]}. ${en}`;
      b.onclick = () => { st()[i] = j; save(); paint(card, it, i); update(); };
      card.querySelector(".opts").appendChild(b);
    });
    list.appendChild(card);
    if (st()[i] !== undefined) paint(card, it, i);
  });
  update();
}

function paint(card, it, i) {
  const pick = st()[i];
  card.classList.add("done");
  card.classList.toggle("wrong", pick !== it.a);
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === it.a) b.classList.add("ok");
    if (j === pick && pick !== it.a) b.classList.add("ng");
  });
  card.querySelector(".exp b").textContent = pick === it.a ? "✅ 정답" : `❌ 오답 — 정답은 ${"ABCD"[it.a]}`;
}

function wrongOf(set) { return SETS[set].map((_, i) => i).filter(i => saved[set][i] !== undefined && saved[set][i] !== SETS[set][i].a); }

function update() {
  const scope = only || qs().map((_, i) => i);
  document.getElementById("prog").style.width = (scope.filter(i => st()[i] !== undefined).length / scope.length * 100) + "%";
  const done = qs().every((_, i) => st()[i] !== undefined);
  document.getElementById("result").style.display = done ? "block" : "none";
  if (!done) return;
  const wrong = wrongOf(cur);
  document.getElementById("resTitle").textContent = cur === "today" ? "오늘의 점수" : "지난 오답 다시 풀기";
  document.getElementById("score").textContent = `${qs().length - wrong.length} / ${qs().length}`;
  document.getElementById("wrongTitle").textContent = wrong.length ? "복습할 표현" : "전부 맞혔어요 👏";
  document.getElementById("wrongList").innerHTML = "";
  wrong.forEach(i => { const li = document.createElement("li"); li.textContent = `${i + 1}번 — ${qs()[i].expr}`;
                       document.getElementById("wrongList").appendChild(li); });
  document.getElementById("retry").style.display = wrong.length ? "" : "none";
  document.getElementById("send").textContent = saved.sent[cur] ? "결과 다시 보내기" : "결과 보내기";
}

// 결과 보내기: 리아가 읽을 수 있는 정해진 형식으로 메일을 만든다 (회사 PC·휴대폰 어디서나 동작)
function resultText(set) {
  const w = wrongOf(set);
  return `[ENG-RESULT] ${DATA.id} ${set} ${SETS[set].length - w.length}/${SETS[set].length} wrong=${w.map(i => i + 1).join(",") || "none"}\n`
       + w.map(i => `- ${i + 1}. ${SETS[set][i].expr}`).join("\n");
}
document.getElementById("send").onclick = () => {
  const body = resultText(cur);
  saved.sent[cur] = new Date().toISOString(); save(); update();
  // 리아 웹(실장님 Mac) 안에서 열렸으면 바로 기록
  if (location.port === "8765") {
    // 리아 웹에서 열었으면 메일 없이 바로 기록하고 끝 (실패하면 메일로)
    fetch("/api/english/result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: DATA.id, set: cur, answers: saved[cur], text: body }) })
      .then(r => { if (!r.ok) throw 0; alert("리아에게 결과를 보냈어요 ✓"); })
      .catch(() => mailResult(body));
    return;
  }
  mailResult(body);
};
function mailResult(body) {
  location.href = "mailto:juslisten@gmail.com?subject=" + encodeURIComponent(`[퀴즈 결과] Day ${DATA.day} (${DATA.date})`)
                + "&body=" + encodeURIComponent(body + "\n\n(이대로 보내기만 하면 리아가 기록해요)");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { cur = t.dataset.set; only = null; render(); window.scrollTo(0, 0); });
document.getElementById("retry").onclick = () => {
  only = wrongOf(cur); only.forEach(i => delete st()[i]); save(); render(); window.scrollTo(0, 0);
};
document.getElementById("reset").onclick = () => { saved[cur] = {}; only = null; save(); render(); window.scrollTo(0, 0); };
function closeQuiz() {
  if (window.parent !== window) { window.parent.postMessage('lia-close-viewer', '*'); return; }
  window.close();
  setTimeout(() => {
    if (location.port === "8765") location.href = "/";
    else if (history.length > 1) history.back();
    else location.href = "about:blank";
  }, 300);
}
document.getElementById("closeTop").onclick = closeQuiz;
document.getElementById("closeEnd").onclick = closeQuiz;
render();
</script>
</body>
</html>
