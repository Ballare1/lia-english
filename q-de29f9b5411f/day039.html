<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘 영어 퀴즈</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
          --blue:#0071e3; --ok:#1a7f37; --okbg:#e8f5ec; --ng:#c62828; --ngbg:#fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --line:#38383a;
            --okbg:#12301c; --ngbg:#3a1414; --ok:#4cc96f; --ng:#ff6b6b; --blue:#2997ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { padding-right:90px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 0; }
  .tab { flex:1; font:inherit; font-size:15px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
         border-radius:12px; padding:9px 8px; cursor:pointer; }
  .tab.on { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .tab small { color:var(--sub); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:14px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
  .q { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .q .meta { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .q .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--line); margin-left:6px; }
  .q h2 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .q .ko { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .opt .oko { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .exp .en { display:block; margin-top:4px; color:var(--sub); }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none;
         border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin:8px 0; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.ng { border-color:var(--ng); background:var(--ngbg); }
  .exp { display:none; margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:14px; }
  .exp b { display:block; margin-bottom:2px; }
  .q.done .exp { display:block; }
  .q.wrong { outline:2px solid var(--ng); outline-offset:-2px; }
  .empty { background:var(--card); border-radius:16px; padding:24px; text-align:center; color:var(--sub); }
  .result { display:none; background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .result .score { font-size:40px; font-weight:700; margin:6px 0; }
  .result ul { text-align:left; padding-left:18px; color:var(--sub); font-size:14px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font:inherit; border:0; border-radius:22px; padding:10px 18px; cursor:pointer; background:var(--blue); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin-top:10px; }
  .close { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
           font:inherit; font-size:14px; border:0; border-radius:18px; padding:7px 14px; cursor:pointer;
           background:var(--card); color:var(--ink); box-shadow:0 1px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<button class="close" id="closeTop" aria-label="퀴즈 닫기">✕ 닫기</button>
<div class="wrap">
  <header><h1 id="title">🧩 오늘 영어 퀴즈</h1><p id="sub"></p></header>
  <div class="tabs">
    <button class="tab on" data-set="today">오늘 퀴즈 <small id="cntToday"></small></button>
    <button class="tab" data-set="review">지난 오답 풀기 <small id="cntReview"></small></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="list"></div>
  <div class="result" id="result">
    <div id="resTitle">오늘의 점수</div>
    <div class="score" id="score"></div>
    <div id="wrongTitle"></div>
    <ul id="wrongList"></ul>
    <div class="btns">
      <button class="btn" id="send">결과 보내기</button>
      <button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>
      <button class="btn ghost" id="reset">처음부터</button>
      <button class="btn ghost" id="closeEnd">닫고 돌아가기</button>
    </div>
    <div class="note" id="sendNote">결과를 보내면 리아가 틀린 표현을 기록해 다음 수업과 "지난 오답 풀기"에 다시 넣어요.</div>
  </div>
</div>
<script>
const DATA = {"id": "day039", "day": 39, "date": "2026-11-16", "theme": "회의·협업 + 📰 시사·경제", "questions": [{"expr": "Just to play that back, ~ (Let me play that back)", "tag": "용법 Usage", "q": "After a long call with the Amazon.sa account manager, you want to sum up the next steps and check you understood. What do you say?", "q_ko": "아마존 사우디 담당자와 긴 통화를 마치고, 다음 단계를 요약하며 제대로 이해했는지 확인하고 싶어요. 뭐라고 할까요?", "opts": ["To play back, you will send the deal slots by Thursday.", "Just to play that back — you'll send the deal slots by Thursday, and we confirm prices on Monday. Have I got that right?", "So basically you're telling me the slots are late again?", "Let me play back to you that the slots come on Thursday."], "a": 1, "why": "play that back + 요약 + Have I got that right?이 자연스러운 틀이에요. 목적어 that이 빠지거나 어순이 어색하면 안 되고, So basically you're telling me는 따지는 느낌이에요.", "why_en": "\"Just to play that back\" + summary + \"Have I got that right?\" confirms politely.", "bank_key": "Just to play that back, ~ (Let me play that back)"}, {"expr": "What are we solving for (here)?", "tag": "톤 Tone", "q": "In a meeting with an HQ vice president, the team is debating a new loyalty app. You want to refocus on the goal without sounding like you're challenging the VP. Which works best?", "q_ko": "본사 부사장과의 회의에서 팀이 새 멤버십 앱을 두고 논쟁 중이에요. 부사장에게 도전하는 것처럼 들리지 않게 목표로 되돌리고 싶어요. 가장 좋은 말은?", "opts": ["What are we solving?", "Why are we even doing this?", "What do we solve for it here?", "Just so we're clear on the goal — what are we solving for here: retention or new sign-ups?"], "a": 3, "why": "끝에 for가 꼭 필요하고, 윗사람 앞에서는 Just so we're clear on the goal —을 붙이면 도전이 아니라 정리로 들려요. Why are we even doing this?는 무례해요.", "why_en": "Softening with \"Just so we're clear on the goal\" keeps the question from sounding like a challenge.", "bank_key": "What are we solving for (here)?"}, {"expr": "To build on what ~ said,", "tag": "용법 Usage", "q": "Sara suggests adding customer reviews to the TV pages on LG.com. You want to take her idea one step further. Which sentence is most natural?", "q_ko": "Sara가 LG.com TV 페이지에 고객 리뷰를 넣자고 했어요. 그 아이디어를 한 단계 더 발전시키고 싶어요. 가장 자연스러운 문장은?", "opts": ["To build on Sara's point, we could also use those reviews in our Instagram ads.", "To build Sara's point, we could also use those reviews in our Instagram ads.", "Building up Sara, we could also use those reviews in our Instagram ads.", "To build on what Sara said, I don't think reviews will help."], "a": 0, "why": "build on + ~'s point / what ~ said가 맞는 형태예요. on이 빠지면 안 되고, 반대 의견을 낼 때는 어울리지 않아요.", "why_en": "\"Build on\" develops someone's idea — it needs \"on\" and doesn't introduce disagreement.", "bank_key": "To build on what ~ said,"}, {"expr": "I'm on the fence (about ~).", "tag": "뉘앙스 Nuance", "q": "Your manager asks whether you support moving the Egypt launch to January. You honestly haven't decided and see good arguments on both sides. Which reply fits?", "q_ko": "상사가 이집트 출시를 1월로 미루는 데 찬성하냐고 물어요. 솔직히 아직 못 정했고 양쪽 다 일리가 있어요. 알맞은 대답은?", "opts": ["I'm not sold on it.", "I'm sold on it.", "Honestly, I'm on the fence — the stock situation says yes, but the Ramadan timing says no.", "I'm over the fence about it."], "a": 2, "why": "on the fence는 진짜 반반인 상태예요. not sold on은 회의적인 쪽, sold on은 이미 찬성이에요. 이유를 함께 말하면 우유부단하게 들리지 않아요.", "why_en": "\"On the fence\" = genuinely undecided; \"not sold on\" leans against.", "bank_key": "I'm on the fence (about ~)."}, {"expr": "consumer sentiment (sours / hits a four-month low)", "tag": "📰 시사 News", "q": "A survey shows Saudi shoppers feel more pessimistic about the economy, but card spending is flat. Which sentence in your monthly report is accurate?", "q_ko": "설문에서 사우디 소비자들이 경제를 더 비관적으로 보지만, 카드 지출은 그대로예요. 월간 보고서에 맞는 문장은?", "opts": ["Consumer spending has soured, but sentiment is flat.", "Consumers' sentiments have soured, but spending is flat.", "Consumer sentiment has risen, but spending is flat.", "Consumer sentiment has soured, but spending has held steady."], "a": 3, "why": "설문으로 잰 '체감'은 consumer sentiment, 실제 지출은 spending이에요. consumer는 단수 수식어로 쓰고 sentiment는 셀 수 없는 명사예요.", "why_en": "Sentiment is how consumers feel; spending is what they actually do.", "bank_key": "consumer sentiment (sours / hits a four-month low)"}, {"expr": "downplay / play down (the risk · likelihood of ~)", "tag": "📰 시사 News", "q": "A Noon manager says a delivery delay is \"nothing to worry about,\" but you think it's serious. In your note to HQ, how do you describe their reaction?", "q_ko": "Noon 담당자는 배송 지연이 '걱정할 일 아니다'라고 하지만, 당신은 심각하다고 봐요. 본사 보고에서 그쪽 반응을 어떻게 쓸까요?", "opts": ["Noon has downplayed the delay, but we see a real risk to White Friday sales.", "Noon has denied the delay, but we see a real risk to White Friday sales.", "Noon has played down it, but we see a real risk to White Friday sales.", "Noon has played up the delay, but we see a real risk to White Friday sales."], "a": 0, "why": "지연을 인정하면서 대수롭지 않게 말한 것이니 downplay예요. deny는 '지연이 없다'고 부인하는 것, play up은 반대로 부풀리는 것이고, play down it은 어순이 틀려요(play it down).", "why_en": "\"Downplay\" = admit it but make it sound smaller; \"deny\" = say it isn't true.", "bank_key": "downplay / play down (the risk · likelihood of ~)"}], "review": [{"expr": "temper (expectations / concerns)", "tag": "지난 오답 Review", "q": "In your weekly note, you want to say that Egypt's weaker-than-expected October has made HQ less optimistic about Q4. Which sentence uses \"temper\" correctly?", "q_ko": "주간 노트에, 이집트 10월 실적이 예상보다 약해서 본사의 4분기 낙관론이 누그러졌다고 쓰고 싶어요. temper를 바르게 쓴 문장은?", "opts": ["Egypt's soft October has tampered HQ's optimism for Q4.", "Egypt's soft October has tempered on HQ's optimism for Q4.", "Egypt's soft October has tempered HQ's optimism for Q4.", "HQ has lost its temper about Q4 after Egypt's soft October."], "a": 2, "why": "temper는 타동사라 바로 목적어(HQ's optimism)를 받아요. tamper는 '함부로 손대다', lose one's temper는 '화내다'라 전혀 다른 뜻이에요. 지난 테스트에서 틀린 표현이에요.", "why_en": "\"Temper\" takes a direct object; don't confuse it with \"tamper\" or \"lose one's temper\".", "bank_key": "temper (expectations / concerns)", "from": "Day 27"}, {"expr": "directionally right / directionally correct", "tag": "지난 오답 Review", "q": "Your team built a quick model of how a 5% price cut would affect OLED volume in Saudi. The numbers are rough, but you trust the direction. How do you present it to your boss?", "q_ko": "팀이 사우디 OLED 5% 가격 인하가 물량에 미칠 영향을 빠르게 모델링했어요. 숫자는 대략이지만 방향은 확신해요. 상사에게 어떻게 말할까요?", "opts": ["These numbers are directionally correct — the exact uplift may change, but the price cut clearly grows volume.", "These numbers are directional correct — the exact uplift may change, but the price cut clearly grows volume.", "These numbers are directionally correct, so you can put them straight into the audited budget.", "These numbers are directly correct — the exact uplift may change, but the price cut clearly grows volume."], "a": 0, "why": "부사 directionally + correct 형태로, '세부는 바뀔 수 있어도 방향은 맞다'고 선을 긋는 말이에요. 확정 숫자처럼 쓰라고 하면 이 표현의 뜻과 어긋나요. 지난 수업에서 틀린 표현이에요.", "why_en": "\"Directionally correct\" = the trend is right even if the exact numbers may change.", "bank_key": "directionally right / directionally correct", "from": "Day 6"}, {"expr": "bolster the case for ~", "tag": "지난 오답 Review", "q": "A pilot of WhatsApp customer service in Egypt cut return requests by 15%. You want to argue for launching it in Morocco. Which sentence is correct?", "q_ko": "이집트에서 왓츠앱 고객 상담을 시범 운영했더니 반품 요청이 15% 줄었어요. 모로코에도 도입하자고 주장하고 싶어요. 맞는 문장은?", "opts": ["The pilot results bolster the case of launching WhatsApp service in Morocco.", "We bolster for the case to launch WhatsApp service in Morocco.", "The pilot results are bolstered the case for launching WhatsApp service in Morocco.", "The pilot results bolster the case for launching WhatsApp service in Morocco."], "a": 3, "why": "주어는 데이터·결과, 틀은 bolster the case for + 명사/동명사예요. of나 to부정사, 수동태는 쓰지 않아요. 지난 테스트에서 틀린 표현이에요.", "why_en": "Data bolsters \"the case for + noun/-ing\".", "bank_key": "bolster the case for ~", "from": "Day 26"}, {"expr": "What would it take to ~?", "tag": "가끔 복습 Review", "q": "A retailer in Johannesburg refuses to give your new soundbar an end-cap display. You want to find out their conditions and keep talking. What do you ask?", "q_ko": "요하네스버그의 한 유통점이 새 사운드바를 매대 끝 진열대에 올려 주지 않겠대요. 대화를 이어 가며 조건을 알아내고 싶어요. 뭐라고 물을까요?", "opts": ["What would take to get an end-cap?", "What would it take to get the soundbar on an end-cap this month?", "What does it take generally to get end-caps?", "What will you take for an end-cap?"], "a": 1, "why": "it을 꼭 넣은 What would it take to ~?가 이번 건의 조건을 끌어내는 질문이에요. What does it take는 일반론이고, What will you take for는 값을 묻는 말처럼 들려요.", "why_en": "\"What would it take to…?\" opens a negotiation about this specific case.", "bank_key": "What would it take to ~?", "from": "Day 11"}]};
const SETS = { today: DATA.questions, review: DATA.review || [] };
const KEY = "eng-quiz-" + DATA.id;
const saved = JSON.parse(localStorage.getItem(KEY) || '{"today":{},"review":{},"sent":{}}');
let cur = location.hash === "#review" ? "review" : "today", only = null;  // 메일의 "지난 오답 풀기" 링크는 #review

document.getElementById("sub").textContent = `Day ${DATA.day} · ${DATA.theme} · ${DATA.date}`;
document.getElementById("cntToday").textContent = `(${SETS.today.length})`;
document.getElementById("cntReview").textContent = `(${SETS.review.length})`;

function save() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function qs() { return SETS[cur]; }
function st() { return saved[cur]; }

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.set === cur));
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!qs().length) {
    list.innerHTML = '<div class="empty">지난 오답이 없어요 👏<br>틀린 문제가 생기면 여기에서 예문을 바꿔 다시 풀 수 있어요.</div>';
    document.getElementById("result").style.display = "none";
    document.getElementById("prog").style.width = "0";
    return;
  }
  qs().forEach((it, i) => {
    if (only && !only.includes(i)) return;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = `<div class="meta">${i + 1} / ${qs().length}<span class="tag"></span></div>
      <h2></h2><div class="ko"></div><div class="opts"></div><div class="exp"><b></b><span></span><span class="en"></span><div class="note"></div></div>`;
    card.querySelector(".tag").textContent = it.tag + (it.from ? ` · ${it.from}` : "");
    card.querySelector("h2").textContent = it.q;
    card.querySelector(".ko").textContent = it.q_ko || "";
    card.querySelector(".exp .en").textContent = it.why_en || "";
    card.querySelector(".exp span").textContent = it.why;
    card.querySelector(".exp .note").textContent = "표현: " + it.expr;
    it.opts.forEach((o, j) => {
      const b = document.createElement("button");
      // 보기는 영어만 보여준다 (한국어 번역은 정답을 흘리므로 표시하지 않음 — 2026-10-25 실장님 지시)
      const en = Array.isArray(o) ? o[0] : o;
      b.className = "opt"; b.textContent = `${"ABCD"[j]}. ${en}`;
      b.onclick = () => { st()[i] = j; save(); paint(card, it, i); update(); };
      card.querySelector(".opts").appendChild(b);
    });
    list.appendChild(card);
    if (st()[i] !== undefined) paint(card, it, i);
  });
  update();
}

function paint(card, it, i) {
  const pick = st()[i];
  card.classList.add("done");
  card.classList.toggle("wrong", pick !== it.a);
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === it.a) b.classList.add("ok");
    if (j === pick && pick !== it.a) b.classList.add("ng");
  });
  card.querySelector(".exp b").textContent = pick === it.a ? "✅ 정답" : `❌ 오답 — 정답은 ${"ABCD"[it.a]}`;
}

function wrongOf(set) { return SETS[set].map((_, i) => i).filter(i => saved[set][i] !== undefined && saved[set][i] !== SETS[set][i].a); }

function update() {
  const scope = only || qs().map((_, i) => i);
  document.getElementById("prog").style.width = (scope.filter(i => st()[i] !== undefined).length / scope.length * 100) + "%";
  const done = qs().every((_, i) => st()[i] !== undefined);
  document.getElementById("result").style.display = done ? "block" : "none";
  if (!done) return;
  const wrong = wrongOf(cur);
  document.getElementById("resTitle").textContent = cur === "today" ? "오늘의 점수" : "지난 오답 다시 풀기";
  document.getElementById("score").textContent = `${qs().length - wrong.length} / ${qs().length}`;
  document.getElementById("wrongTitle").textContent = wrong.length ? "복습할 표현" : "전부 맞혔어요 👏";
  document.getElementById("wrongList").innerHTML = "";
  wrong.forEach(i => { const li = document.createElement("li"); li.textContent = `${i + 1}번 — ${qs()[i].expr}`;
                       document.getElementById("wrongList").appendChild(li); });
  document.getElementById("retry").style.display = wrong.length ? "" : "none";
  document.getElementById("send").textContent = saved.sent[cur] ? "결과 다시 보내기" : "결과 보내기";
}

// 결과 보내기: 리아가 읽을 수 있는 정해진 형식으로 메일을 만든다 (회사 PC·휴대폰 어디서나 동작)
function resultText(set) {
  const w = wrongOf(set);
  return `[ENG-RESULT] ${DATA.id} ${set} ${SETS[set].length - w.length}/${SETS[set].length} wrong=${w.map(i => i + 1).join(",") || "none"}\n`
       + w.map(i => `- ${i + 1}. ${SETS[set][i].expr}`).join("\n");
}
document.getElementById("send").onclick = () => {
  const body = resultText(cur);
  saved.sent[cur] = new Date().toISOString(); save(); update();
  // 리아 웹(실장님 Mac) 안에서 열렸으면 바로 기록
  if (location.port === "8765") {
    // 리아 웹에서 열었으면 메일 없이 바로 기록하고 끝 (실패하면 메일로)
    fetch("/api/english/result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: DATA.id, set: cur, answers: saved[cur], text: body }) })
      .then(r => { if (!r.ok) throw 0; alert("리아에게 결과를 보냈어요 ✓"); })
      .catch(() => mailResult(body));
    return;
  }
  mailResult(body);
};
function mailResult(body) {
  location.href = "mailto:juslisten@gmail.com?subject=" + encodeURIComponent(`[퀴즈 결과] Day ${DATA.day} (${DATA.date})`)
                + "&body=" + encodeURIComponent(body + "\n\n(이대로 보내기만 하면 리아가 기록해요)");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { cur = t.dataset.set; only = null; render(); window.scrollTo(0, 0); });
document.getElementById("retry").onclick = () => {
  only = wrongOf(cur); only.forEach(i => delete st()[i]); save(); render(); window.scrollTo(0, 0);
};
document.getElementById("reset").onclick = () => { saved[cur] = {}; only = null; save(); render(); window.scrollTo(0, 0); };
function closeQuiz() {
  if (window.parent !== window) { window.parent.postMessage('lia-close-viewer', '*'); return; }
  window.close();
  setTimeout(() => {
    if (location.port === "8765") location.href = "/";
    else if (history.length > 1) history.back();
    else location.href = "about:blank";
  }, 300);
}
document.getElementById("closeTop").onclick = closeQuiz;
document.getElementById("closeEnd").onclick = closeQuiz;
render();
</script>
