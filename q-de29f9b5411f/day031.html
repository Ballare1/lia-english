<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘 영어 퀴즈</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
          --blue:#0071e3; --ok:#1a7f37; --okbg:#e8f5ec; --ng:#c62828; --ngbg:#fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --line:#38383a;
            --okbg:#12301c; --ngbg:#3a1414; --ok:#4cc96f; --ng:#ff6b6b; --blue:#2997ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { padding-right:90px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 0; }
  .tab { flex:1; font:inherit; font-size:15px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
         border-radius:12px; padding:9px 8px; cursor:pointer; }
  .tab.on { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .tab small { color:var(--sub); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:14px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
  .q { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .q .meta { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .q .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--line); margin-left:6px; }
  .q h2 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .q .ko { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .opt .oko { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .exp .en { display:block; margin-top:4px; color:var(--sub); }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none;
         border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin:8px 0; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.ng { border-color:var(--ng); background:var(--ngbg); }
  .exp { display:none; margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:14px; }
  .exp b { display:block; margin-bottom:2px; }
  .q.done .exp { display:block; }
  .q.wrong { outline:2px solid var(--ng); outline-offset:-2px; }
  .empty { background:var(--card); border-radius:16px; padding:24px; text-align:center; color:var(--sub); }
  .result { display:none; background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .result .score { font-size:40px; font-weight:700; margin:6px 0; }
  .result ul { text-align:left; padding-left:18px; color:var(--sub); font-size:14px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font:inherit; border:0; border-radius:22px; padding:10px 18px; cursor:pointer; background:var(--blue); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin-top:10px; }
  .close { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
           font:inherit; font-size:14px; border:0; border-radius:18px; padding:7px 14px; cursor:pointer;
           background:var(--card); color:var(--ink); box-shadow:0 1px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<button class="close" id="closeTop" aria-label="퀴즈 닫기">✕ 닫기</button>
<div class="wrap">
  <header><h1 id="title">🧩 오늘 영어 퀴즈</h1><p id="sub"></p></header>
  <div class="tabs">
    <button class="tab on" data-set="today">오늘 퀴즈 <small id="cntToday"></small></button>
    <button class="tab" data-set="review">지난 오답 풀기 <small id="cntReview"></small></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="list"></div>
  <div class="result" id="result">
    <div id="resTitle">오늘의 점수</div>
    <div class="score" id="score"></div>
    <div id="wrongTitle"></div>
    <ul id="wrongList"></ul>
    <div class="btns">
      <button class="btn" id="send">결과 보내기</button>
      <button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>
      <button class="btn ghost" id="reset">처음부터</button>
      <button class="btn ghost" id="closeEnd">닫고 돌아가기</button>
    </div>
    <div class="note" id="sendNote">결과를 보내면 리아가 틀린 표현을 기록해 다음 수업과 "지난 오답 풀기"에 다시 넣어요.</div>
  </div>
</div>
<script>
const DATA = {"id": "day031", "day": 31, "date": "2026-11-03", "theme": "회의·협업 + 📰 시사·경제", "questions": [{"expr": "Just to play that back, ~ (Let me play that back)", "tag": "뉘앙스 Nuance", "q": "At the end of a call with your agency, you want to confirm what was agreed without sounding accusatory. What do you say?", "q_ko": "에이전시와 통화를 마치며, 따지는 느낌 없이 합의 내용을 확인하고 싶어요. 뭐라고 할까요?", "opts": ["So what you're really saying is you can't deliver on time?", "Let me play you back: the launch moves to the 12th.", "Just to play that back — the launch moves to the 12th and assets come by Friday. Have I got that right?", "Just to play back you, the launch moves to the 12th."], "a": 2, "why": "요약 후 Have I got that right?로 확인하면 공손해요. So what you're really saying은 따지는 느낌이고, play you back·play back you는 어순이 틀려요.", "why_en": "\"Just to play that back\" checks understanding politely.", "bank_key": "Just to play that back, ~ (Let me play that back)"}, {"expr": "What are we solving for (here)?", "tag": "용법 Usage", "q": "Your team is arguing over 10% vs 15% off, and nobody has mentioned the goal. Which question brings them back to it?", "q_ko": "팀이 10%냐 15%냐로 다투는데 목표 이야기는 아무도 안 해요. 목표로 되돌리는 질문은?", "opts": ["Hold on — what are we solving for here: volume or margin?", "Hold on — what are we solving here: volume or margin?", "Hold on — what do we solve about here: volume or margin?", "Hold on — what are we solved for here: volume or margin?"], "a": 0, "why": "solve for x에서 온 표현이라 끝의 for가 꼭 필요하고, 능동 진행형으로 써요.", "why_en": "\"What are we solving for?\" needs the \"for\" and refocuses on the goal.", "bank_key": "What are we solving for (here)?"}, {"expr": "To build on what ~ said,", "tag": "용법 Usage", "q": "Layla suggests a TV-soundbar bundle on LG.com, and you want to develop her idea further. Which sentence works?", "q_ko": "Layla가 LG.com에 TV·사운드바 번들을 제안했고, 그 아이디어를 더 발전시키고 싶어요. 알맞은 문장은?", "opts": ["To build up what Layla said, we could offer it on Noon too.", "To build on Layla, we could offer it on Noon too.", "To build on what Layla said, her idea won't work at all.", "To build on what Layla said, we could offer the same bundle on Noon too."], "a": 3, "why": "on이 필수이고 what ~ said를 붙여요. 반대 의견을 낼 때는 어울리지 않아요.", "why_en": "\"To build on what X said\" develops a colleague's idea; it doesn't oppose it.", "bank_key": "To build on what ~ said,"}, {"expr": "I'm on the fence (about ~).", "tag": "뉘앙스 Nuance", "q": "You see real pros and cons in opening the Morocco store early and have no leaning yet. Which sentence says that best?", "q_ko": "모로코 스토어를 일찍 여는 데 장단점이 다 보이고, 아직 어느 쪽으로도 기울지 않았어요. 가장 잘 맞는 문장은?", "opts": ["I'm not sold on opening the Morocco store early.", "I'm on the fence about opening the Morocco store early.", "I'm in the fence about opening the Morocco store early.", "I'm sold on opening the Morocco store early."], "a": 1, "why": "on the fence는 진짜 중립이에요. not sold on은 회의적인 쪽으로 기운 말이고, sold on은 이미 설득된 상태예요.", "why_en": "\"On the fence\" means genuinely undecided; \"not sold on\" leans negative.", "bank_key": "I'm on the fence (about ~)."}, {"expr": "wait-and-see (mode / approach)", "tag": "📰 시사 News", "q": "Egyptian retailers are delaying Q1 orders until the currency settles. How do you describe this in your report to HQ?", "q_ko": "이집트 거래선들이 환율이 안정될 때까지 1분기 주문을 미루고 있어요. 본사 보고에 어떻게 쓸까요?", "opts": ["Retailers are on wait-and-seeing mode until the pound settles.", "Retailers are in wait-and-see mode until the pound settles.", "Retailers wait-and-see the pound until it settles.", "Retailers are in wait and saw mode until the pound settles."], "a": 1, "why": "be in wait-and-see mode가 고정된 형태예요. 하이픈으로 묶어 명사 앞에 쓰고, 동사처럼 활용하지 않아요.", "why_en": "\"In wait-and-see mode\" is the fixed form, used before a noun with hyphens.", "bank_key": "wait-and-see (mode / approach)"}, {"expr": "keep / leave (someone) guessing", "tag": "📰 시사 News", "q": "Samsung hasn't revealed its White Friday prices, and your team can't plan around them. Which sentence says that?", "q_ko": "삼성이 화이트 프라이데이 가격을 공개하지 않아 팀이 대응 계획을 못 세우고 있어요. 이를 나타내는 문장은?", "opts": ["Samsung is keeping guessing us on its pricing.", "Samsung is guessing us on its pricing.", "We are keeping Samsung guessing on its pricing.", "Samsung is keeping us guessing on its pricing."], "a": 3, "why": "keep + 사람 + guessing 순서예요. We are keeping Samsung guessing이라고 하면 우리가 삼성을 헷갈리게 한다는 반대 뜻이 돼요.", "why_en": "\"Keep someone guessing\" = the person kept in the dark goes in the middle.", "bank_key": "keep / leave (someone) guessing"}], "review": [{"expr": "Where do you land on ~? / Where I've landed is ~", "tag": "지난 오답 Review", "q": "Your Cairo manager has been weighing whether to extend the instalment offer into Q1. In a one-to-one, you want their considered view. What do you ask?", "q_ko": "카이로 담당자가 할부 혜택을 1분기까지 연장할지 고민해 왔어요. 1:1 자리에서 숙고한 의견을 묻고 싶어요. 뭐라고 물을까요?", "opts": ["What's your landing on the instalment offer?", "Where do you land at the instalment offer?", "Where have you landed for the instalment offer?", "Where do you land on extending the instalment offer?"], "a": 3, "why": "상대의 생각을 물을 땐 Where do you land on ~?이에요. on을 at·for로 바꾸거나 명사 landing으로 쓰면 어색해요.", "why_en": "\"Where do you land on X?\" asks for someone's considered view.", "bank_key": "Where do you land on ~? / Where I've landed is ~", "from": "Day 4"}, {"expr": "bolster the case for ~", "tag": "지난 오답 Review", "q": "Returns fell after the new washer product page went live in Saudi, which supports rolling it out in Türkiye. Which sentence is correct?", "q_ko": "사우디에 세탁기 새 상품 페이지를 연 뒤 반품이 줄었고, 튀르키예에도 적용하자는 주장에 힘이 실려요. 맞는 문장은?", "opts": ["The lower return rate bolsters the case for rolling the page out in Türkiye.", "The lower return rate bolsters the case of rolling the page out in Türkiye.", "The lower return rate bolsters for the case to roll the page out in Türkiye.", "The lower return rate is bolstered the case for rolling the page out in Türkiye."], "a": 0, "why": "bolster the case for + 명사·동명사가 정해진 틀이에요. of나 to부정사를 쓰지 않아요. 지난 테스트에서 틀린 표현이라 다시 냈어요.", "why_en": "The pattern is \"bolster the case for + noun or -ing\".", "bank_key": "bolster the case for ~", "from": "Day 26"}, {"expr": "concerns linger / lingering concerns (over ~)", "tag": "지난 오답 Review", "q": "A strike at Jeddah port has ended, but partners are still worried about the backlog. Which sentence is correct?", "q_ko": "제다항 파업은 끝났지만 파트너들은 여전히 적체를 걱정해요. 맞는 문장은?", "opts": ["The strike is over, but concerns linger the backlog at the port.", "The strike is over, but concerns are lingered over the backlog at the port.", "The strike is over, but concerns linger over the backlog at the port.", "The strike is over, but lingered concerns of the backlog stay at the port."], "a": 2, "why": "linger는 자동사라 목적어·수동태 없이 concerns linger over ~로 써요. 형용사로는 lingered가 아니라 lingering이에요. 지난 테스트에서 틀린 표현이에요.", "why_en": "\"Linger\" is intransitive: concerns linger over X; the adjective is \"lingering\".", "bank_key": "concerns linger / lingering concerns (over ~)", "from": "Day 26"}, {"expr": "a heads-up", "tag": "복습 Review", "q": "Noon's flash sale starts Friday and could cause a 55-inch stock-out. You want to warn your team informally on Slack. What do you write?", "q_ko": "Noon 플래시 세일이 금요일에 시작해 55인치 품절이 날 수 있어요. 슬랙으로 팀에 가볍게 미리 알리고 싶어요. 뭐라고 쓸까요?", "opts": ["Just head up — Noon's flash sale starts Friday, so the 55-inch may run out.", "Just a heads-up — Noon's flash sale starts Friday, so the 55-inch may run out.", "I hereby give a heads-up regarding Noon's flash sale on Friday.", "Just a head-up — Noon's flash sale starts Friday, so the 55-inch may run out."], "a": 1, "why": "a heads-up으로 s까지 붙여 써요. 가벼운 사전 알림 표현이라 hereby 같은 격식어와는 어울리지 않아요.", "why_en": "\"A heads-up\" is a casual advance warning; keep the -s and the article.", "bank_key": "a heads-up", "from": "Day 1"}]};
const SETS = { today: DATA.questions, review: DATA.review || [] };
const KEY = "eng-quiz-" + DATA.id;
const saved = JSON.parse(localStorage.getItem(KEY) || '{"today":{},"review":{},"sent":{}}');
let cur = location.hash === "#review" ? "review" : "today", only = null;  // 메일의 "지난 오답 풀기" 링크는 #review

document.getElementById("sub").textContent = `Day ${DATA.day} · ${DATA.theme} · ${DATA.date}`;
document.getElementById("cntToday").textContent = `(${SETS.today.length})`;
document.getElementById("cntReview").textContent = `(${SETS.review.length})`;

function save() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function qs() { return SETS[cur]; }
function st() { return saved[cur]; }

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.set === cur));
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!qs().length) {
    list.innerHTML = '<div class="empty">지난 오답이 없어요 👏<br>틀린 문제가 생기면 여기에서 예문을 바꿔 다시 풀 수 있어요.</div>';
    document.getElementById("result").style.display = "none";
    document.getElementById("prog").style.width = "0";
    return;
  }
  qs().forEach((it, i) => {
    if (only && !only.includes(i)) return;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = `<div class="meta">${i + 1} / ${qs().length}<span class="tag"></span></div>
      <h2></h2><div class="ko"></div><div class="opts"></div><div class="exp"><b></b><span></span><span class="en"></span><div class="note"></div></div>`;
    card.querySelector(".tag").textContent = it.tag + (it.from ? ` · ${it.from}` : "");
    card.querySelector("h2").textContent = it.q;
    card.querySelector(".ko").textContent = it.q_ko || "";
    card.querySelector(".exp .en").textContent = it.why_en || "";
    card.querySelector(".exp span").textContent = it.why;
    card.querySelector(".exp .note").textContent = "표현: " + it.expr;
    it.opts.forEach((o, j) => {
      const b = document.createElement("button");
      // 보기는 영어만 보여준다 (한국어 번역은 정답을 흘리므로 표시하지 않음 — 2026-10-25 실장님 지시)
      const en = Array.isArray(o) ? o[0] : o;
      b.className = "opt"; b.textContent = `${"ABCD"[j]}. ${en}`;
      b.onclick = () => { st()[i] = j; save(); paint(card, it, i); update(); };
      card.querySelector(".opts").appendChild(b);
    });
    list.appendChild(card);
    if (st()[i] !== undefined) paint(card, it, i);
  });
  update();
}

function paint(card, it, i) {
  const pick = st()[i];
  card.classList.add("done");
  card.classList.toggle("wrong", pick !== it.a);
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === it.a) b.classList.add("ok");
    if (j === pick && pick !== it.a) b.classList.add("ng");
  });
  card.querySelector(".exp b").textContent = pick === it.a ? "✅ 정답" : `❌ 오답 — 정답은 ${"ABCD"[it.a]}`;
}

function wrongOf(set) { return SETS[set].map((_, i) => i).filter(i => saved[set][i] !== undefined && saved[set][i] !== SETS[set][i].a); }

function update() {
  const scope = only || qs().map((_, i) => i);
  document.getElementById("prog").style.width = (scope.filter(i => st()[i] !== undefined).length / scope.length * 100) + "%";
  const done = qs().every((_, i) => st()[i] !== undefined);
  document.getElementById("result").style.display = done ? "block" : "none";
  if (!done) return;
  const wrong = wrongOf(cur);
  document.getElementById("resTitle").textContent = cur === "today" ? "오늘의 점수" : "지난 오답 다시 풀기";
  document.getElementById("score").textContent = `${qs().length - wrong.length} / ${qs().length}`;
  document.getElementById("wrongTitle").textContent = wrong.length ? "복습할 표현" : "전부 맞혔어요 👏";
  document.getElementById("wrongList").innerHTML = "";
  wrong.forEach(i => { const li = document.createElement("li"); li.textContent = `${i + 1}번 — ${qs()[i].expr}`;
                       document.getElementById("wrongList").appendChild(li); });
  document.getElementById("retry").style.display = wrong.length ? "" : "none";
  document.getElementById("send").textContent = saved.sent[cur] ? "결과 다시 보내기" : "결과 보내기";
}

// 결과 보내기: 리아가 읽을 수 있는 정해진 형식으로 메일을 만든다 (회사 PC·휴대폰 어디서나 동작)
function resultText(set) {
  const w = wrongOf(set);
  return `[ENG-RESULT] ${DATA.id} ${set} ${SETS[set].length - w.length}/${SETS[set].length} wrong=${w.map(i => i + 1).join(",") || "none"}\n`
       + w.map(i => `- ${i + 1}. ${SETS[set][i].expr}`).join("\n");
}
document.getElementById("send").onclick = () => {
  const body = resultText(cur);
  saved.sent[cur] = new Date().toISOString(); save(); update();
  // 리아 웹(실장님 Mac) 안에서 열렸으면 바로 기록
  if (location.port === "8765") {
    // 리아 웹에서 열었으면 메일 없이 바로 기록하고 끝 (실패하면 메일로)
    fetch("/api/english/result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: DATA.id, set: cur, answers: saved[cur], text: body }) })
      .then(r => { if (!r.ok) throw 0; alert("리아에게 결과를 보냈어요 ✓"); })
      .catch(() => mailResult(body));
    return;
  }
  mailResult(body);
};
function mailResult(body) {
  location.href = "mailto:juslisten@gmail.com?subject=" + encodeURIComponent(`[퀴즈 결과] Day ${DATA.day} (${DATA.date})`)
                + "&body=" + encodeURIComponent(body + "\n\n(이대로 보내기만 하면 리아가 기록해요)");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { cur = t.dataset.set; only = null; render(); window.scrollTo(0, 0); });
document.getElementById("retry").onclick = () => {
  only = wrongOf(cur); only.forEach(i => delete st()[i]); save(); render(); window.scrollTo(0, 0);
};
document.getElementById("reset").onclick = () => { saved[cur] = {}; only = null; save(); render(); window.scrollTo(0, 0); };
function closeQuiz() {
  if (window.parent !== window) { window.parent.postMessage('lia-close-viewer', '*'); return; }
  window.close();
  setTimeout(() => {
    if (location.port === "8765") location.href = "/";
    else if (history.length > 1) history.back();
    else location.href = "about:blank";
  }, 300);
}
document.getElementById("closeTop").onclick = closeQuiz;
document.getElementById("closeEnd").onclick = closeQuiz;
render();
</script>
</body>
</html>
