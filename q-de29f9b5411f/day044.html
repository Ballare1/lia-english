<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘 영어 퀴즈</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
          --blue:#0071e3; --ok:#1a7f37; --okbg:#e8f5ec; --ng:#c62828; --ngbg:#fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --line:#38383a;
            --okbg:#12301c; --ngbg:#3a1414; --ok:#4cc96f; --ng:#ff6b6b; --blue:#2997ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { padding-right:90px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 0; }
  .tab { flex:1; font:inherit; font-size:15px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
         border-radius:12px; padding:9px 8px; cursor:pointer; }
  .tab.on { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .tab small { color:var(--sub); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:14px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
  .q { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .q .meta { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .q .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--line); margin-left:6px; }
  .q h2 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .q .ko { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .opt .oko { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .exp .en { display:block; margin-top:4px; color:var(--sub); }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none;
         border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin:8px 0; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.ng { border-color:var(--ng); background:var(--ngbg); }
  .exp { display:none; margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:14px; }
  .exp b { display:block; margin-bottom:2px; }
  .q.done .exp { display:block; }
  .q.wrong { outline:2px solid var(--ng); outline-offset:-2px; }
  .empty { background:var(--card); border-radius:16px; padding:24px; text-align:center; color:var(--sub); }
  .result { display:none; background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .result .score { font-size:40px; font-weight:700; margin:6px 0; }
  .result ul { text-align:left; padding-left:18px; color:var(--sub); font-size:14px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font:inherit; border:0; border-radius:22px; padding:10px 18px; cursor:pointer; background:var(--blue); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin-top:10px; }
  .close { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
           font:inherit; font-size:14px; border:0; border-radius:18px; padding:7px 14px; cursor:pointer;
           background:var(--card); color:var(--ink); box-shadow:0 1px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<button class="close" id="closeTop" aria-label="퀴즈 닫기">✕ 닫기</button>
<div class="wrap">
  <header><h1 id="title">🧩 오늘 영어 퀴즈</h1><p id="sub"></p></header>
  <div class="tabs">
    <button class="tab on" data-set="today">오늘 퀴즈 <small id="cntToday"></small></button>
    <button class="tab" data-set="review">지난 오답 풀기 <small id="cntReview"></small></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="list"></div>
  <div class="result" id="result">
    <div id="resTitle">오늘의 점수</div>
    <div class="score" id="score"></div>
    <div id="wrongTitle"></div>
    <ul id="wrongList"></ul>
    <div class="btns">
      <button class="btn" id="send">결과 보내기</button>
      <button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>
      <button class="btn ghost" id="reset">처음부터</button>
      <button class="btn ghost" id="closeEnd">닫고 돌아가기</button>
    </div>
    <div class="note" id="sendNote">결과를 보내면 리아가 틀린 표현을 기록해 다음 수업과 "지난 오답 풀기"에 다시 넣어요.</div>
  </div>
</div>
<script>
const DATA = {"id": "day044", "day": 44, "date": "2026-11-23", "theme": "회의·협업 + 📰 시사·경제", "questions": [{"expr": "How are you holding up?", "tag": "용법 Usage", "q": "Your Egypt team lead has worked late every night since a warehouse flood. You open your 1:1 call. Which opener fits best?", "q_ko": "창고 침수 이후 이집트 팀장이 매일 밤늦게까지 일했어요. 1:1 통화를 시작해요. 가장 알맞은 첫마디는?", "opts": ["I heard about the flood — how are you holding on?", "I heard about the flood — how are you held up?", "I heard about the flood — how are you holding up?", "I heard about the flood — how do you hold up?"], "a": 2, "why": "힘든 상황을 아는 상태에서 건네는 안부는 How are you holding up?이에요. holding on은 '버텨/잠깐만', held up은 '지연되다'예요.", "why_en": "\"How are you holding up?\" checks in on someone going through a tough stretch.", "bank_key": "How are you holding up?"}, {"expr": "Let's catch up properly (soon / when ~).", "tag": "용법 Usage", "q": "You bump into a Noon category head at a conference but only have two minutes. How do you close warmly and keep the relationship going?", "q_ko": "콘퍼런스에서 Noon 카테고리 책임자를 만났는데 2분밖에 없어요. 따뜻하게 마무리하며 관계를 이어 가려면?", "opts": ["Let's catch up properly soon — are you free for lunch next week?", "Let's catch up properly on you soon — are you free for lunch next week?", "Let's catch properly up soon — are you free for lunch next week?", "Let's catch up proper soon — are you free for lunch next week?"], "a": 0, "why": "Let's catch up properly가 자연스러운 어순이에요. 사람은 with, 일은 on을 써서 on you는 어색하고, properly는 catch up 뒤에 와요.", "why_en": "\"Let's catch up properly\" — adverb after the phrasal verb; \"catch up with\" a person.", "bank_key": "Let's catch up properly (soon / when ~)."}, {"expr": "I take your point, but ~ (Point taken.)", "tag": "뉘앙스 Nuance", "q": "Finance wants to cut the Saudi search budget to protect margin. You see their logic but want to push back. Which is best?", "q_ko": "재무팀이 마진을 지키려고 사우디 검색 광고 예산을 줄이자고 해요. 논리는 인정하지만 반대하고 싶어요. 가장 좋은 말은?", "opts": ["That's a fair point — let's cut it then.", "I'm taking your point, but cutting search now would hand Black Friday traffic to Samsung.", "Point taken.", "I take your point, but cutting search now would hand Black Friday traffic to Samsung."], "a": 3, "why": "I take your point, but ~이 '논리 인정 + 반론'이에요. That's a fair point는 동의 쪽, Point taken.은 지적을 받아들이는 말, 진행형 I'm taking은 쓰지 않아요.", "why_en": "\"I take your point, but…\" acknowledges the logic, then disagrees.", "bank_key": "I take your point, but ~ (Point taken.)"}, {"expr": "I hear you. (I hear you, but ~)", "tag": "뉘앙스 Nuance", "q": "A frustrated country manager says HQ keeps changing the promo calendar. You want to acknowledge the frustration without saying HQ is wrong. Which fits best?", "q_ko": "답답해하는 국가 법인장이 본사가 프로모션 일정을 계속 바꾼다고 해요. 본사가 틀렸다고 하지 않으면서 답답함은 인정하고 싶어요. 가장 알맞은 말은?", "opts": ["I listen to you — three changes in two weeks is a lot. Let me ask HQ to freeze it until January.", "I hear you — three changes in two weeks is a lot. Let me ask HQ to freeze it until January.", "I heard you — three changes in two weeks is a lot. Let me ask HQ to freeze it until January.", "I agree completely — HQ is wrong. Let me ask them to freeze it until January."], "a": 1, "why": "I hear you는 동의가 아니라 감정·상황 공감이에요. I listen to you는 이 뜻이 아니고, I heard you는 '이미 들었어'로 들려요. 마지막 보기는 본사를 탓하는 말이라 의도와 달라요.", "why_en": "\"I hear you\" validates feelings without signalling full agreement.", "bank_key": "I hear you. (I hear you, but ~)"}, {"expr": "📰 (X times) oversubscribed (↔ undersubscribed)", "tag": "용법 Usage", "q": "Your LG.com KSA influencer experience day had 40 seats and 160 registrations. How do you report it in the weekly update?", "q_ko": "LG.com 사우디 인플루언서 체험 행사 좌석은 40석인데 신청이 160명이었어요. 주간 보고에 어떻게 쓸까요?", "opts": ["The experience day was four times oversubscribed.", "The experience day was oversubscribed four times more.", "The experience day was four times over-subscribing.", "The experience day was four times undersubscribed."], "a": 0, "why": "정원 대비 신청이 4배면 four times oversubscribed예요. 배수는 앞에 두고 과거분사형으로 써요. undersubscribed는 반대(미달)예요.", "why_en": "Demand at 4x capacity = \"four times oversubscribed\".", "bank_key": "(X times) oversubscribed (↔ undersubscribed)"}, {"expr": "📰 blockbuster (IPO / deal / launch / quarter)", "tag": "용법 Usage", "q": "In a board update, which sentence uses 'blockbuster' naturally?", "q_ko": "이사회 보고에서 blockbuster를 자연스럽게 쓴 문장은?", "opts": ["Our Egypt manager is a real blockbuster.", "Noon sales were blockbuster up 40% year on year.", "We had a blockbusting White Friday on Noon, with sales up 40% year on year.", "We had a blockbuster White Friday on Noon, with sales up 40% year on year."], "a": 3, "why": "blockbuster는 명사 앞에서 '초대형·대박의'로 꾸며요(a blockbuster White Friday). 사람에게 쓰거나 부사처럼 쓰면 어색하고, blockbusting이라는 형태는 쓰지 않아요.", "why_en": "Use it before a noun: \"a blockbuster quarter/IPO/launch\".", "bank_key": "blockbuster (IPO / deal / launch / quarter)"}], "review": [{"expr": "temper (expectations / concerns)", "tag": "지난 오답 Review", "q": "A Saudi bank partner expects a new 0% installment offer to double LG.com orders overnight. You think +15% is realistic. What do you say on the call?", "q_ko": "사우디 은행 파트너가 새 무이자 할부로 LG.com 주문이 하루아침에 두 배가 될 거라고 기대해요. 현실적으로는 +15%라고 봐요. 통화에서 뭐라고 할까요?", "opts": ["Let's tamper our expectations a bit — +15% is more realistic.", "Let's temper our expectations a bit — +15% is more realistic.", "Let's temper down with our expectations a bit — +15% is more realistic.", "Let's lose our temper on expectations a bit — +15% is more realistic."], "a": 1, "why": "기대를 현실적으로 낮출 땐 temper + 목적어예요(전치사 없음). tamper는 '함부로 손대다', lose one's temper는 '화내다'예요.", "why_en": "\"Temper expectations\" = make them more realistic; no preposition.", "bank_key": "temper (expectations / concerns)", "from": "Day 27"}, {"expr": "directionally right / directionally correct", "tag": "지난 오답 Review", "q": "Your social-listening tool says sentiment about LG washers in Türkiye has improved, but it misreads some Turkish slang. The CMO asks if the data is usable. How do you answer?", "q_ko": "소셜 리스닝 도구는 튀르키예에서 LG 세탁기 여론이 좋아졌다고 하지만, 튀르키예 속어를 일부 잘못 읽어요. CMO가 데이터를 써도 되는지 물어요. 어떻게 답할까요?", "opts": ["It's directly accurate, so we can quote the exact scores.", "It's direction correct, but the exact scores are fuzzy.", "It's directionally wrong, but still useful.", "It's directionally correct — sentiment is improving — but I wouldn't quote the exact scores."], "a": 3, "why": "수치는 정확하지 않아도 방향(여론 개선)은 맞을 때 directionally correct예요. directly는 '직접', direction은 명사라 안 맞아요.", "why_en": "\"Directionally correct\" = the trend is right even if the numbers are rough.", "bank_key": "directionally right / directionally correct", "from": "Day 6"}, {"expr": "bolster the case for ~", "tag": "지난 오답 Review", "q": "A two-week test shows that video reviews on product pages cut air-conditioner returns in the UAE. You want to argue for adding them across all categories. Which sentence works?", "q_ko": "2주 테스트에서 상품 페이지 영상 리뷰가 UAE 에어컨 반품을 줄였어요. 전 카테고리로 넓히자고 주장하고 싶어요. 맞는 문장은?", "opts": ["The test results bolster the case for adding video reviews across all categories.", "The test results bolster on the case to add video reviews across all categories.", "The case for video reviews bolsters the test results across all categories.", "The test results are bolstering to the case of video reviews across all categories."], "a": 0, "why": "[근거] bolsters the case for [주장/~ing]이 기본형이에요. on·to를 붙이지 않고, 주어와 목적어를 바꾸면 뜻이 뒤집혀요.", "why_en": "Evidence \"bolsters the case for\" a proposal.", "bank_key": "bolster the case for ~", "from": "Day 26"}, {"expr": "bandwidth", "tag": "가끔 복습 Review", "q": "Your agency asks your team to also run TikTok community management in December. Your team is already stretched. How do you decline politely?", "q_ko": "에이전시가 12월에 틱톡 커뮤니티 관리까지 맡아 달라고 해요. 팀은 이미 한계예요. 어떻게 정중하게 거절할까요?", "opts": ["We don't have bandwidths for that right now.", "Our bandwidth is very wide for that right now.", "We don't have the bandwidth to take that on in December — could we revisit it in January?", "We don't have the band for that in December."], "a": 2, "why": "업무 여력이라는 뜻의 bandwidth는 셀 수 없는 명사라 복수형이 없어요. have the bandwidth to + 동사로 써요. wide·band는 이 뜻이 아니에요.", "why_en": "\"Bandwidth\" (capacity) is uncountable: \"have the bandwidth to…\".", "bank_key": "bandwidth"}]};
const SETS = { today: DATA.questions, review: DATA.review || [] };
const KEY = "eng-quiz-" + DATA.id;
const saved = JSON.parse(localStorage.getItem(KEY) || '{"today":{},"review":{},"sent":{}}');
let cur = location.hash === "#review" ? "review" : "today", only = null;  // 메일의 "지난 오답 풀기" 링크는 #review

document.getElementById("sub").textContent = `Day ${DATA.day} · ${DATA.theme} · ${DATA.date}`;
document.getElementById("cntToday").textContent = `(${SETS.today.length})`;
document.getElementById("cntReview").textContent = `(${SETS.review.length})`;

function save() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function qs() { return SETS[cur]; }
function st() { return saved[cur]; }

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.set === cur));
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!qs().length) {
    list.innerHTML = '<div class="empty">지난 오답이 없어요 👏<br>틀린 문제가 생기면 여기에서 예문을 바꿔 다시 풀 수 있어요.</div>';
    document.getElementById("result").style.display = "none";
    document.getElementById("prog").style.width = "0";
    return;
  }
  qs().forEach((it, i) => {
    if (only && !only.includes(i)) return;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = `<div class="meta">${i + 1} / ${qs().length}<span class="tag"></span></div>
      <h2></h2><div class="ko"></div><div class="opts"></div><div class="exp"><b></b><span></span><span class="en"></span><div class="note"></div></div>`;
    card.querySelector(".tag").textContent = it.tag + (it.from ? ` · ${it.from}` : "");
    card.querySelector("h2").textContent = it.q;
    card.querySelector(".ko").textContent = it.q_ko || "";
    card.querySelector(".exp .en").textContent = it.why_en || "";
    card.querySelector(".exp span").textContent = it.why;
    card.querySelector(".exp .note").textContent = "표현: " + it.expr;
    it.opts.forEach((o, j) => {
      const b = document.createElement("button");
      // 보기는 영어만 보여준다 (한국어 번역은 정답을 흘리므로 표시하지 않음 — 2026-10-25 실장님 지시)
      const en = Array.isArray(o) ? o[0] : o;
      b.className = "opt"; b.textContent = `${"ABCD"[j]}. ${en}`;
      b.onclick = () => { st()[i] = j; save(); paint(card, it, i); update(); };
      card.querySelector(".opts").appendChild(b);
    });
    list.appendChild(card);
    if (st()[i] !== undefined) paint(card, it, i);
  });
  update();
}

function paint(card, it, i) {
  const pick = st()[i];
  card.classList.add("done");
  card.classList.toggle("wrong", pick !== it.a);
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === it.a) b.classList.add("ok");
    if (j === pick && pick !== it.a) b.classList.add("ng");
  });
  card.querySelector(".exp b").textContent = pick === it.a ? "✅ 정답" : `❌ 오답 — 정답은 ${"ABCD"[it.a]}`;
}

function wrongOf(set) { return SETS[set].map((_, i) => i).filter(i => saved[set][i] !== undefined && saved[set][i] !== SETS[set][i].a); }

function update() {
  const scope = only || qs().map((_, i) => i);
  document.getElementById("prog").style.width = (scope.filter(i => st()[i] !== undefined).length / scope.length * 100) + "%";
  const done = qs().every((_, i) => st()[i] !== undefined);
  document.getElementById("result").style.display = done ? "block" : "none";
  if (!done) return;
  const wrong = wrongOf(cur);
  document.getElementById("resTitle").textContent = cur === "today" ? "오늘의 점수" : "지난 오답 다시 풀기";
  document.getElementById("score").textContent = `${qs().length - wrong.length} / ${qs().length}`;
  document.getElementById("wrongTitle").textContent = wrong.length ? "복습할 표현" : "전부 맞혔어요 👏";
  document.getElementById("wrongList").innerHTML = "";
  wrong.forEach(i => { const li = document.createElement("li"); li.textContent = `${i + 1}번 — ${qs()[i].expr}`;
                       document.getElementById("wrongList").appendChild(li); });
  document.getElementById("retry").style.display = wrong.length ? "" : "none";
  document.getElementById("send").textContent = saved.sent[cur] ? "결과 다시 보내기" : "결과 보내기";
}

// 결과 보내기: 리아가 읽을 수 있는 정해진 형식으로 메일을 만든다 (회사 PC·휴대폰 어디서나 동작)
function resultText(set) {
  const w = wrongOf(set);
  return `[ENG-RESULT] ${DATA.id} ${set} ${SETS[set].length - w.length}/${SETS[set].length} wrong=${w.map(i => i + 1).join(",") || "none"}\n`
       + w.map(i => `- ${i + 1}. ${SETS[set][i].expr}`).join("\n");
}
document.getElementById("send").onclick = () => {
  const body = resultText(cur);
  saved.sent[cur] = new Date().toISOString(); save(); update();
  // 리아 웹(실장님 Mac) 안에서 열렸으면 바로 기록
  if (location.port === "8765") {
    // 리아 웹에서 열었으면 메일 없이 바로 기록하고 끝 (실패하면 메일로)
    fetch("/api/english/result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: DATA.id, set: cur, answers: saved[cur], text: body }) })
      .then(r => { if (!r.ok) throw 0; alert("리아에게 결과를 보냈어요 ✓"); })
      .catch(() => mailResult(body));
    return;
  }
  mailResult(body);
};
function mailResult(body) {
  location.href = "mailto:juslisten@gmail.com?subject=" + encodeURIComponent(`[퀴즈 결과] Day ${DATA.day} (${DATA.date})`)
                + "&body=" + encodeURIComponent(body + "\n\n(이대로 보내기만 하면 리아가 기록해요)");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { cur = t.dataset.set; only = null; render(); window.scrollTo(0, 0); });
document.getElementById("retry").onclick = () => {
