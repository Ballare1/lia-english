<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘 영어 퀴즈</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
          --blue:#0071e3; --ok:#1a7f37; --okbg:#e8f5ec; --ng:#c62828; --ngbg:#fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --line:#38383a;
            --okbg:#12301c; --ngbg:#3a1414; --ok:#4cc96f; --ng:#ff6b6b; --blue:#2997ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  header { padding-right:90px; }
  header h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--sub); font-size:14px; }
  .tabs { display:flex; gap:8px; margin:16px 0 0; }
  .tab { flex:1; font:inherit; font-size:15px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
         border-radius:12px; padding:9px 8px; cursor:pointer; }
  .tab.on { border-color:var(--blue); color:var(--blue); font-weight:600; }
  .tab small { color:var(--sub); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:14px 0 18px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--blue); transition:width .3s; }
  .q { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .q .meta { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .q .tag { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--line); margin-left:6px; }
  .q h2 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .q .ko { color:var(--sub); font-size:14px; margin:0 0 12px; }
  .opt .oko { display:block; color:var(--sub); font-size:13px; margin-top:2px; }
  .exp .en { display:block; margin-top:4px; color:var(--sub); }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none;
         border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; margin:8px 0; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--blue); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.ng { border-color:var(--ng); background:var(--ngbg); }
  .exp { display:none; margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); font-size:14px; }
  .exp b { display:block; margin-bottom:2px; }
  .q.done .exp { display:block; }
  .q.wrong { outline:2px solid var(--ng); outline-offset:-2px; }
  .empty { background:var(--card); border-radius:16px; padding:24px; text-align:center; color:var(--sub); }
  .result { display:none; background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .result .score { font-size:40px; font-weight:700; margin:6px 0; }
  .result ul { text-align:left; padding-left:18px; color:var(--sub); font-size:14px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font:inherit; border:0; border-radius:22px; padding:10px 18px; cursor:pointer; background:var(--blue); color:#fff; }
  .btn.ghost { background:var(--line); color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin-top:10px; }
  .close { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:10;
           font:inherit; font-size:14px; border:0; border-radius:18px; padding:7px 14px; cursor:pointer;
           background:var(--card); color:var(--ink); box-shadow:0 1px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<button class="close" id="closeTop" aria-label="퀴즈 닫기">✕ 닫기</button>
<div class="wrap">
  <header><h1 id="title">🧩 오늘 영어 퀴즈</h1><p id="sub"></p></header>
  <div class="tabs">
    <button class="tab on" data-set="today">오늘 퀴즈 <small id="cntToday"></small></button>
    <button class="tab" data-set="review">지난 오답 풀기 <small id="cntReview"></small></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="list"></div>
  <div class="result" id="result">
    <div id="resTitle">오늘의 점수</div>
    <div class="score" id="score"></div>
    <div id="wrongTitle"></div>
    <ul id="wrongList"></ul>
    <div class="btns">
      <button class="btn" id="send">결과 보내기</button>
      <button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>
      <button class="btn ghost" id="reset">처음부터</button>
      <button class="btn ghost" id="closeEnd">닫고 돌아가기</button>
    </div>
    <div class="note" id="sendNote">결과를 보내면 리아가 틀린 표현을 기록해 다음 수업과 "지난 오답 풀기"에 다시 넣어요.</div>
  </div>
</div>
<script>
const DATA = {"id": "day037", "day": 37, "date": "2026-11-12", "theme": "실적·전략 + 📰 시사·경제", "questions": [{"expr": "percentage points (pts / pp) — up/down X points", "bank_key": "percentage points (pts / pp) — up/down X points", "tag": "용법 Usage", "q": "Your LG.com conversion rate went from 2.0% to 2.5%. Which sentence is accurate in a report to HQ?", "q_ko": "LG.com 전환율이 2.0%에서 2.5%로 올랐어요. 본사 보고서에 정확한 문장은?", "opts": ["Conversion rose 5% to 2.5%.", "Conversion rose half a percentage point to 2.5%.", "Conversion rose 0.5 percents to 2.5%.", "Conversion rose 0.5%p to 2.5%."], "a": 1, "why": "비율 지표끼리의 차이는 percentage point로 말해요. 'rose 5%'는 상대 변화(2.0%의 5%)로 읽히고, percents는 틀린 형태, %p는 영어 표기가 아니에요(pp / pts).", "why_en": "A change between two rates is measured in percentage points, not percent."}, {"expr": "(broadly) flat / flattish", "bank_key": "(broadly) flat / flattish", "tag": "뉘앙스 Nuance", "q": "Egypt revenue was EGP 410M last year and EGP 412M this year. In the written quarterly report, which phrase fits best?", "q_ko": "이집트 매출이 작년 4억 1천만, 올해 4억 1,200만 파운드예요. 분기 보고서(문서)에 가장 잘 맞는 표현은?", "opts": ["Revenue flatly remained year on year.", "Revenue was kinda flattish year on year.", "Revenue was stable and strong year on year.", "Revenue was broadly flat year on year."], "a": 3, "why": "문서에는 broadly flat이 정석이에요. flatly는 '단호하게'라 틀리고, kinda flattish는 너무 캐주얼, 'stable and strong'은 0.5% 성장을 과장해요.", "why_en": "\"Broadly flat\" is the standard written phrase for near-zero change."}, {"expr": "supply disruption(s) / on supply concerns", "bank_key": "supply disruption(s) / on supply concerns", "tag": "용법 Usage", "q": "You're writing a market note on shipping risk in the Gulf. Which sentence is most natural?", "q_ko": "걸프 해운 리스크에 대한 시장 메모를 쓰고 있어요. 가장 자연스러운 문장은?", "opts": ["Further tanker attacks near Hormuz could cause supply disruption to our GCC shipments.", "Further tanker attacks near Hormuz could cause a supply disturbance of our GCC shipments.", "Further tanker attacks near Hormuz could disrupt the supply shortage in the GCC.", "Further tanker attacks near Hormuz could make supply disruptions to rise."], "a": 0, "why": "supply disruption to ~가 자연스러운 짝이에요. supply disturbance는 어색하고, '부족을 끊는다'는 말은 뜻이 거꾸로, make ~ to rise는 문법이 틀려요.", "why_en": "\"Supply disruption to ~\" is the natural collocation."}, {"expr": "come in hotter / cooler than expected", "bank_key": "come in hotter / cooler than expected", "tag": "용법 Usage", "q": "US October inflation was above forecasts. How would you say it in your Monday market briefing?", "q_ko": "미국 10월 물가가 예상보다 높았어요. 월요일 시황 브리핑에서 어떻게 말할까요?", "opts": ["US inflation was hotter of expected in October.", "US inflation came hotter than expected in October.", "US inflation came in hotter than expected in October.", "US inflation came in hot than expected in October."], "a": 2, "why": "지표 발표는 came in으로 받고, 비교급 hotter than expected로 써요. in을 빼거나(came hotter), of expected, hot than은 모두 틀려요.", "why_en": "Data releases \"come in\" hotter or cooler than expected."}, {"expr": "📰 show signs of strain", "bank_key": "show signs of strain", "tag": "📰 뉘앙스 Nuance", "q": "Basket sizes in Egypt are down 8% and more buyers choose long installment plans. Which line warns HQ without sounding alarmist?", "q_ko": "이집트 객단가가 8% 줄고 장기 할부를 고르는 고객이 늘었어요. 과장하지 않으면서 본사에 경고하는 문장은?", "opts": ["Egyptian consumers are collapsing.", "Egyptian consumers have completely stopped spending.", "Egyptian consumers are in a full-blown crisis.", "Egyptian consumers are showing signs of strain."], "a": 3, "why": "show signs of strain은 '아직 무너지진 않았지만 부담 조짐이 보인다'는 절제된 경고예요. 나머지는 데이터보다 훨씬 과장돼요.", "why_en": "\"Showing signs of strain\" flags pressure without overstating it."}, {"expr": "📰 rein in (spending / costs)", "bank_key": "rein in (spending / costs)", "tag": "📰 상황 Situation", "q": "HQ wants you to reduce agency spending in a controlled way this quarter — not stop it. Which line fits your email?", "q_ko": "본사가 이번 분기 에이전시 비용을 '끊지 말고 통제하며' 줄이길 원해요. 이메일에 맞는 문장은?", "opts": ["We'll cut off agency spending this quarter.", "We'll rein in agency spending this quarter.", "We'll reign in agency spending this quarter.", "We'll rein out agency spending this quarter."], "a": 1, "why": "rein in은 고삐를 죄듯 '통제하며 줄이다'예요. cut off는 아예 끊는 것, reign은 철자 오류('군림하다'), rein out은 없는 표현이에요.", "why_en": "\"Rein in\" = bring under control; note the spelling (not \"reign\")."}], "review": [{"expr": "temper (expectations / concerns)", "bank_key": "temper (expectations / concerns)", "tag": "지난 오답 Review", "from": "Day 27", "q": "Your South Africa team expects a big jump in OLED sales after one strong launch week. On the weekly call, how do you manage expectations politely?", "q_ko": "남아공 팀이 출시 첫 주 성과 하나만 보고 OLED 판매가 크게 뛸 거라 기대해요. 주간 회의에서 기대치를 정중하게 조절하는 말은?", "opts": ["Let's tamper our expectations a bit.", "Let's not lose our temper on expectations.", "I'd temper expectations a little — one strong week isn't a trend yet.", "I'd temper with expectations a little."], "a": 2, "why": "temper expectations = 기대치를 현실적으로 낮추다. tamper는 '조작하다', lose one's temper는 '화내다', temper with는 쓰지 않아요.", "why_en": "\"Temper expectations\" — no preposition, not \"tamper\"."}, {"expr": "directionally right / directionally correct", "bank_key": "directionally right / directionally correct", "tag": "지난 오답 Review", "from": "Day 32", "q": "A regional director asks whether your small brand-awareness survey in Morocco can be trusted. The sample is small, but the trend is clear. Best reply?", "q_ko": "지역 임원이 모로코 브랜드 인지도 소규모 조사를 믿어도 되는지 물어요. 표본은 작지만 추세는 분명해요. 가장 좋은 답은?", "opts": ["Treat the exact figures with caution, but it's directionally right — awareness is rising.", "It's directional correct — awareness is rising.", "It's exactly right — awareness is up 4.2 points.", "It's direction-right — awareness is rising."], "a": 0, "why": "정확도의 한계를 먼저 인정하고 '방향은 맞다'고 선을 긋는 게 이 표현의 정석이에요. directional correct·direction-right는 틀린 형태, exactly right는 작은 표본을 과신하는 말이에요.", "why_en": "Admit the precision limits, then say it's \"directionally right\"."}, {"expr": "bolster the case for ~", "bank_key": "bolster the case for ~", "tag": "지난 오답 Review", "from": "Day 26", "q": "Saudi shoppers who used the AR room planner on LG.com bought 30% more. You want to propose rolling it out in the UAE. Which line works best?", "q_ko": "LG.com AR 공간 배치 도구를 쓴 사우디 고객이 30% 더 구매했어요. UAE 확대를 제안할 때 가장 좋은 문장은?", "opts": ["This data bolsters for the case of the UAE.", "This data makes the case bolster for the UAE rollout.", "This data bolsters to the UAE rollout.", "This data bolsters the case for rolling it out in the UAE."], "a": 3, "why": "데이터(주어)가 bolster the case for + 명사/동명사 순으로 주장을 받쳐 줘요. 나머지는 어순·전치사가 틀려요.", "why_en": "Pattern: [evidence] bolsters the case for [doing something]."}, {"expr": "borrowing costs", "bank_key": "borrowing costs", "tag": "가끔 복습 Review", "from": "Day 29", "q": "Rate-hike bets are rising after hot US inflation. You're explaining why distributors in Türkiye are ordering less. Which sentence is most natural?", "q_ko": "미국 물가가 높게 나와 금리 인상 전망이 커졌어요. 튀르키예 유통사들이 발주를 줄이는 이유를 설명할 때 가장 자연스러운 문장은?", "opts": ["Borrowing cost is rise, so distributors are careful.", "Higher borrowing costs are making distributors cautious about holding stock.", "Borrow costs are higher for the distributors.", "The borrowing's costs climbed for distributors."], "a": 1, "why": "borrowing costs는 보통 복수형이고, '돈 빌리는 부담'이 재고 보유를 꺼리게 만든다는 흐름이 자연스러워요. 나머지는 형태가 틀려요.", "why_en": "\"Borrowing costs\" is usually plural: higher borrowing costs make firms cautious."}]};
const SETS = { today: DATA.questions, review: DATA.review || [] };
const KEY = "eng-quiz-" + DATA.id;
const saved = JSON.parse(localStorage.getItem(KEY) || '{"today":{},"review":{},"sent":{}}');
let cur = location.hash === "#review" ? "review" : "today", only = null;  // 메일의 "지난 오답 풀기" 링크는 #review

document.getElementById("sub").textContent = `Day ${DATA.day} · ${DATA.theme} · ${DATA.date}`;
document.getElementById("cntToday").textContent = `(${SETS.today.length})`;
document.getElementById("cntReview").textContent = `(${SETS.review.length})`;

function save() { localStorage.setItem(KEY, JSON.stringify(saved)); }
function qs() { return SETS[cur]; }
function st() { return saved[cur]; }

function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.set === cur));
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!qs().length) {
    list.innerHTML = '<div class="empty">지난 오답이 없어요 👏<br>틀린 문제가 생기면 여기에서 예문을 바꿔 다시 풀 수 있어요.</div>';
    document.getElementById("result").style.display = "none";
    document.getElementById("prog").style.width = "0";
    return;
  }
  qs().forEach((it, i) => {
    if (only && !only.includes(i)) return;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = `<div class="meta">${i + 1} / ${qs().length}<span class="tag"></span></div>
      <h2></h2><div class="ko"></div><div class="opts"></div><div class="exp"><b></b><span></span><span class="en"></span><div class="note"></div></div>`;
    card.querySelector(".tag").textContent = it.tag + (it.from ? ` · ${it.from}` : "");
    card.querySelector("h2").textContent = it.q;
    card.querySelector(".ko").textContent = it.q_ko || "";
    card.querySelector(".exp .en").textContent = it.why_en || "";
    card.querySelector(".exp span").textContent = it.why;
    card.querySelector(".exp .note").textContent = "표현: " + it.expr;
    it.opts.forEach((o, j) => {
      const b = document.createElement("button");
      // 보기는 영어만 보여준다 (한국어 번역은 정답을 흘리므로 표시하지 않음 — 2026-10-25 실장님 지시)
      const en = Array.isArray(o) ? o[0] : o;
      b.className = "opt"; b.textContent = `${"ABCD"[j]}. ${en}`;
      b.onclick = () => { st()[i] = j; save(); paint(card, it, i); update(); };
      card.querySelector(".opts").appendChild(b);
    });
    list.appendChild(card);
    if (st()[i] !== undefined) paint(card, it, i);
  });
  update();
}

function paint(card, it, i) {
  const pick = st()[i];
  card.classList.add("done");
  card.classList.toggle("wrong", pick !== it.a);
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === it.a) b.classList.add("ok");
    if (j === pick && pick !== it.a) b.classList.add("ng");
  });
  card.querySelector(".exp b").textContent = pick === it.a ? "✅ 정답" : `❌ 오답 — 정답은 ${"ABCD"[it.a]}`;
}

function wrongOf(set) { return SETS[set].map((_, i) => i).filter(i => saved[set][i] !== undefined && saved[set][i] !== SETS[set][i].a); }

function update() {
  const scope = only || qs().map((_, i) => i);
  document.getElementById("prog").style.width = (scope.filter(i => st()[i] !== undefined).length / scope.length * 100) + "%";
  const done = qs().every((_, i) => st()[i] !== undefined);
  document.getElementById("result").style.display = done ? "block" : "none";
  if (!done) return;
  const wrong = wrongOf(cur);
  document.getElementById("resTitle").textContent = cur === "today" ? "오늘의 점수" : "지난 오답 다시 풀기";
  document.getElementById("score").textContent = `${qs().length - wrong.length} / ${qs().length}`;
  document.getElementById("wrongTitle").textContent = wrong.length ? "복습할 표현" : "전부 맞혔어요 👏";
  document.getElementById("wrongList").innerHTML = "";
  wrong.forEach(i => { const li = document.createElement("li"); li.textContent = `${i + 1}번 — ${qs()[i].expr}`;
                       document.getElementById("wrongList").appendChild(li); });
  document.getElementById("retry").style.display = wrong.length ? "" : "none";
  document.getElementById("send").textContent = saved.sent[cur] ? "결과 다시 보내기" : "결과 보내기";
}

// 결과 보내기: 리아가 읽을 수 있는 정해진 형식으로 메일을 만든다 (회사 PC·휴대폰 어디서나 동작)
function resultText(set) {
  const w = wrongOf(set);
  return `[ENG-RESULT] ${DATA.id} ${set} ${SETS[set].length - w.length}/${SETS[set].length} wrong=${w.map(i => i + 1).join(",") || "none"}\n`
       + w.map(i => `- ${i + 1}. ${SETS[set][i].expr}`).join("\n");
}
document.getElementById("send").onclick = () => {
  const body = resultText(cur);
  saved.sent[cur] = new Date().toISOString(); save(); update();
  // 리아 웹(실장님 Mac) 안에서 열렸으면 바로 기록
  if (location.port === "8765") {
    // 리아 웹에서 열었으면 메일 없이 바로 기록하고 끝 (실패하면 메일로)
    fetch("/api/english/result", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: DATA.id, set: cur, answers: saved[cur], text: body }) })
      .then(r => { if (!r.ok) throw 0; alert("리아에게 결과를 보냈어요 ✓"); })
      .catch(() => mailResult(body));
    return;
  }
  mailResult(body);
};
function mailResult(body) {
  location.href = "mailto:juslisten@gmail.com?subject=" + encodeURIComponent(`[퀴즈 결과] Day ${DATA.day} (${DATA.date})`)
                + "&body=" + encodeURIComponent(body + "\n\n(이대로 보내기만 하면 리아가 기록해요)");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { cur = t.dataset.set; only = null; render(); window.scrollTo(0, 0); });
document.getElementById("retry").onclick = () => {
  only = wrongOf(cur); only.forEach(i => delete st()[i]); save(); render(); window.scrollTo(0, 0);
};
document.getElementById("reset").onclick = () => { saved[cur] = {}; only = null; save(); render(); window.scrollTo(0, 0); };
function closeQuiz() {
  if (window.parent !== window) { window.parent.postMessage('lia-close-viewer', '*'); return; }
  window.close();
  setTimeout(() => {
    if (location.port === "8765") location.href = "/";
    else if (history.length > 1) history.back();
    else location.href = "about:blank";
  }, 300);
}
document.getElementById("closeTop").onclick = closeQuiz;
document.getElementById("closeEnd").onclick = closeQuiz;
render();
</script>
</body>
</html>
